<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SniperPlug Capture</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{margin:0;width:350px;background:#071018;color:#eef7f4}
    main{display:grid;gap:12px;padding:16px}
    h1{font-size:17px;margin:0}p{margin:0;color:#aebfba;line-height:1.45;font-size:13px}
    .card{border:1px solid #24352f;border-radius:14px;background:#0d171f;padding:12px;display:grid;gap:7px}
    .card strong{font-size:14px}.meta{font-size:12px;color:#86dba9;overflow-wrap:anywhere}
    button,select{border:1px solid #2c443a;border-radius:999px;padding:10px 13px;background:#14221f;color:#effbf5;font:inherit;font-weight:700}
    button{cursor:pointer}button.primary{background:#5ee69c;color:#07120d;border-color:#5ee69c}button:disabled{opacity:.45;cursor:not-allowed}
    select{width:100%;font-weight:600}.row{display:flex;gap:8px}.row>*{flex:1}
    label{display:flex;gap:8px;align-items:flex-start;color:#c8d7d2;font-size:12px;line-height:1.35}
    input{margin-top:2px}.status{min-height:34px;padding:9px 10px;border-radius:10px;background:#09141e;color:#b7c7c2;font-size:12px;line-height:1.4}
    .status[data-state="error"]{color:#ffb8b8}.status[data-state="ok"]{color:#8ff0b7}
    .progress{font-size:12px;color:#b9cac4;line-height:1.45}.diagnostic{font-size:11px;color:#849994;line-height:1.4}
    ul{margin:0;padding-left:18px;color:#aebfba;font-size:12px;max-height:90px;overflow:auto}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <div>
      <h1>SniperPlug Better Content Capture</h1>
      <p>Reads only content rendered inside the authorized Whop app frame.</p>
    </div>
    <section class="card">
      <strong id="pageTitle">Looking for Better Content…</strong>
      <span class="meta" id="pageMeta"></span>
      <p id="pageDetail">Open Hidden Files → Make Money Here inside Whop in Firefox Nightly.</p>
      <button id="openWhop" type="button" hidden>Open Whop in Firefox</button>
    </section>
    <section class="card">
      <strong>Capture all</strong>
      <select id="crawlScope" aria-label="Capture scope">
        <option value="experience">Entire experience</option>
        <option value="section">This section only</option>
      </select>
      <button id="crawl" class="primary" type="button">Capture all guides</button>
      <div id="crawlMeta" class="progress"></div>
      <div id="crawlDiagnostic" class="diagnostic"></div>
      <ul id="crawlFailures"></ul>
    </section>
    <div class="row">
      <button id="capture" type="button">Capture page</button>
      <button id="auto" type="button">Capture as I browse: off</button>
    </div>
    <section class="card">
      <strong id="queueCount">0 pages queued</strong>
      <ul id="queueTitles"></ul>
      <button id="clear" type="button">Clear queue</button>
    </section>
    <label><input id="rights" type="checkbox"> <span>I own this content or have explicit permission to republish it through SniperPlug.</span></label>
    <label><input id="sendWhenDone" type="checkbox"> <span>After Capture all finishes, automatically send changed/new pages to SniperPlug.</span></label>
    <button id="send" class="primary" type="button" disabled>Send queued pages to SniperPlug</button>
    <div class="status" id="status" aria-live="polite">Ready.</div>
    <div class="diagnostic" id="versionStatus"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
