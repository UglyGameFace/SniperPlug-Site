name: Verify SniperPlug

on:
  pull_request:
  push:
    branches: [main, agent/whop-guide-importer]

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-sniperplug-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run full build and regression suite
        run: npm run build
      - name: Publish authoritative build status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state='success'; description='Node 22 build and regression suite passed' ;;
            failure) state='failure'; description='Node 22 build or regression suite failed' ;;
            *) state='error'; description='Node 22 validation was canceled or interrupted' ;;
          esac
          payload="$(jq -nc \
            --arg state "$state" \
            --arg context 'ci/sniperplug-node22' \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null
