name: Apply and verify SniperPlug R2 hard-free safeguards

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-sniperplug-r2-hard-free
  cancel-in-progress: false

jobs:
  build:
    if: github.head_ref == 'agent/whop-guide-importer'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: agent/whop-guide-importer
          fetch-depth: 0

      - name: Apply validated hard-free implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/0b8cc529a57ed01b2dea0385e3867252fb08a572" \
            > /tmp/sniperplug.blob.json
          python - <<'PY'
          import base64
          import bz2
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/sniperplug.blob.json').read_text())
          encoded_text = base64.b64decode(payload['content']).decode('ascii')
          compressed = base64.b64decode(encoded_text)
          Path('/tmp/sniperplug.patch').write_bytes(bz2.decompress(compressed))
          PY
          git apply --check /tmp/sniperplug.patch
          git apply /tmp/sniperplug.patch
          rm -f .hard-free-trigger
          cat > .github/workflows/whop-importer-validation.yml <<'FINAL_WORKFLOW'
          name: Verify SniperPlug

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main, agent/whop-guide-importer]

          permissions:
            contents: read

          concurrency:
            group: verify-sniperplug-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4
                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Install dependencies
                  run: npm install --ignore-scripts
                - name: Run full build and regression suite
                  run: npm run build
          FINAL_WORKFLOW

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run full build and regression suite
        run: npm run build

      - name: Validate migration SQL
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.executescript(Path('migrations/0003_media_hard_free.sql').read_text())
          columns = {row[1] for row in db.execute('PRAGMA table_info(media_storage_state)')}
          assert {'copy_day', 'copies_today', 'origin_reads_today'} <= columns
          assert db.execute('SELECT COUNT(*) FROM media_storage_state').fetchone()[0] == 1
          PY

      - name: Commit validated safeguards
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enforce R2 hard-free media safeguards"
          git push origin HEAD:agent/whop-guide-importer
