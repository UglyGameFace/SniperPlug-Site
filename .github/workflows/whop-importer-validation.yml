name: SniperPlug importer validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/whop-guide-importer]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate importer
        run: npm run build
