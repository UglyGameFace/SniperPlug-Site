name: Apply and verify SniperPlug video review fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-sniperplug-video-review-fix
  cancel-in-progress: false

jobs:
  build:
    if: github.head_ref == 'agent/whop-guide-importer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: agent/whop-guide-importer
          fetch-depth: 0
      - name: Apply exact video review implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one exact replacement, found {text.count(old)}')
              file.write_text(text.replace(old, new))

          replace('functions/_lib/whop-items.js',
          "const MAX_ITEMS = 2000;\n",
          "const MAX_ITEMS = 2000;\nconst COURSE_DETAIL_CONCURRENCY = 4;\n")

          replace('functions/_lib/whop-items.js',
          "function sourceContext(experience) {\n",
          """async function mapConcurrent(values, mapper, concurrency = COURSE_DETAIL_CONCURRENCY) {
            const output = new Array(values.length);
            let cursor = 0;
            async function worker() {
              while (cursor < values.length) {
                const index = cursor;
                cursor += 1;
                output[index] = await mapper(values[index], index);
              }
            }
            await Promise.all(Array.from({ length: Math.min(concurrency, Math.max(1, values.length)) }, () => worker()));
            return output;
          }

          function courseLessonNeedsDetail(lesson) {
            const type = String(lesson?.lesson_type || lesson?.type || '').toLowerCase();
            if (/(?:video|audio|media)/.test(type)) return true;
            if (lesson?.video_asset || lesson?.video_asset_id || lesson?.thumbnail) return true;
            const hasBody = Boolean(whopContentToMarkdown(lesson?.content || '').trim());
            const hasFiles = Boolean(lesson?.main_pdf || (Array.isArray(lesson?.attachments) && lesson.attachments.length));
            return !hasBody && !hasFiles;
          }

          async function detailedCourseLesson(session, lesson) {
            if (!courseLessonNeedsDetail(lesson) || !lesson?.id) return { lesson, detailDeferred: true };
            try {
              return { lesson: await whopApi(session, `course_lessons/${encodeURIComponent(lesson.id)}`), detailDeferred: false };
            } catch {
              return { lesson, detailDeferred: true };
            }
          }

          function sourceContext(experience) {
          """)

          replace('functions/_lib/whop-items.js',
          "function courseAttachments(lesson) {\n  const values = [];\n",
          "function courseAttachments(lesson) {\n  const values = [];\n  const thumbnail = fileInput(lesson?.thumbnail, 'course-thumbnail');\n  if (thumbnail) values.push(thumbnail);\n")

          replace('functions/_lib/whop-items.js',
          "      role: 'hosted-video',\n      reviewReason: 'Whop-hosted course video requires permanent SniperPlug media storage before publication.',\n",
          "      role: 'hosted-video',\n      duration_seconds: Number(lesson.video_asset.duration_seconds || lesson.video_asset.duration || 0) || null,\n      reviewReason: 'Whop-hosted video detected. SniperPlug attaches authorized source-quality playback when this lesson is imported.',\n")

          replace('functions/_lib/whop-items.js',
          "      const lessons = await allPages(session, 'course_lessons', { course_id: course.id });\n      for (const lesson of lessons) output.push(courseItem(lesson, course, experience, { detailDeferred: true }));\n",
          "      const lessons = await allPages(session, 'course_lessons', { course_id: course.id });\n      const detailed = await mapConcurrent(lessons, (lesson) => detailedCourseLesson(session, lesson));\n      for (const entry of detailed) {\n        output.push(courseItem(entry.lesson, entry.lesson?.course || course, experience, { detailDeferred: entry.detailDeferred }));\n      }\n")

          replace('functions/_lib/posts.js',
          "    role: String(attachment?.role || 'attachment').slice(0, 80),\n    reviewReason: String(attachment?.reviewReason || '').slice(0, 400) || null,\n",
          "    role: String(attachment?.role || 'attachment').slice(0, 80),\n    durationSeconds: Number(attachment?.duration_seconds || attachment?.durationSeconds || 0) || null,\n    reviewReason: String(attachment?.reviewReason || '').slice(0, 400) || null,\n")

          replace('assets/js/control-center-v2.js',
          "    card.style.contentVisibility = 'auto';\n    card.style.containIntrinsicSize = '1px 260px';\n",
          "")

          replace('assets/js/control-center-v2.js',
          "    const diagnostics = document.createElement('div');\n    diagnostics.className = 'post-diagnostics';\n    diagnostics.textContent = policyText(post);\n    const actions = document.createElement('div');\n",
          """    const diagnostics = document.createElement('div');
            diagnostics.className = 'post-diagnostics';
            diagnostics.textContent = policyText(post);
            const mediaFiles = (post.attachments || []).filter((file) => ['course-thumbnail', 'hosted-video'].includes(file.role));
            const media = document.createElement('div');
            media.className = 'post-media-summary';
            media.hidden = mediaFiles.length === 0;
            const thumbnail = mediaFiles.find((file) => file.role === 'course-thumbnail' && file.url);
            if (thumbnail) {
              const image = document.createElement('img');
              image.src = thumbnail.url;
              image.alt = '';
              image.loading = 'lazy';
              image.decoding = 'async';
              media.append(image);
            }
            const hostedVideo = mediaFiles.find((file) => file.role === 'hosted-video');
            if (hostedVideo) {
              const copy = document.createElement('div');
              const heading = document.createElement('strong');
              const seconds = Number(hostedVideo.durationSeconds || 0);
              const minutes = seconds > 0 ? Math.max(1, Math.round(seconds / 60)) : 0;
              heading.textContent = minutes ? `Video detected · ${minutes} min` : 'Video detected';
              const detail = document.createElement('span');
              detail.textContent = hostedVideo.uploadStatus && hostedVideo.uploadStatus !== 'ready'
                ? `Whop status: ${hostedVideo.uploadStatus}`
                : 'Source-quality playback will be attached during import.';
              copy.append(heading, detail);
              media.append(copy);
            }
            const actions = document.createElement('div');
          """)

          replace('assets/js/control-center-v2.js',
          "    card.append(header, excerpt, diagnostics, actions);\n",
          "    card.append(header, excerpt, media, diagnostics, actions);\n")

          old_render = """  function renderPosts() {
            const token = ++state.postRenderToken;
            elements.postList.replaceChildren();
            let index = 0;
            const appendChunk = (deadline) => {
              if (token !== state.postRenderToken) return;
              const fragment = document.createDocumentFragment();
              let count = 0;
              while (index < state.postOrder.length && (count < 20 || deadline.timeRemaining() > 2)) {
                const post = state.posts.get(state.postOrder[index]);
                index += 1;
                count += 1;
                if (post) fragment.append(createPostCard(post));
              }
              elements.postList.append(fragment);
              if (index < state.postOrder.length) idle(appendChunk);
            };
            idle(appendChunk);
            syncPostControls();
          }
          """
          new_render = """  function renderPosts() {
            const token = ++state.postRenderToken;
            elements.postList.replaceChildren();
            let index = 0;
            const appendCount = (limit) => {
              if (token !== state.postRenderToken) return;
              const fragment = document.createDocumentFragment();
              let count = 0;
              while (index < state.postOrder.length && count < limit) {
                const post = state.posts.get(state.postOrder[index]);
                index += 1;
                count += 1;
                if (post) fragment.append(createPostCard(post));
              }
              elements.postList.append(fragment);
            };
            appendCount(Math.min(12, state.postOrder.length));
            const appendRemaining = (deadline) => {
              if (token !== state.postRenderToken) return;
              const budget = Math.max(8, Math.min(30, Math.floor(deadline.timeRemaining() * 3) || 8));
              appendCount(budget);
              if (index < state.postOrder.length) idle(appendRemaining);
            };
            if (index < state.postOrder.length) idle(appendRemaining);
            syncPostControls();
          }

          function afterLayoutPaint() {
            return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          }
          """
          replace('assets/js/control-center-v2.js', old_render, new_render)

          replace('assets/js/control-center-v2.js',
          "      renderPosts();\n      elements.postPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });\n",
          "      renderPosts();\n      await afterLayoutPaint();\n      elements.postPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });\n")

          css = Path('assets/css/control-center-hardening.css')
          css.write_text(css.read_text() + """

          .post-media-summary{display:flex;align-items:center;gap:.85rem;min-width:0;padding:.75rem;border:1px solid rgba(53,194,255,.24);border-radius:16px;background:rgba(53,194,255,.06)}
          .post-media-summary[hidden]{display:none}
          .post-media-summary img{width:112px;max-width:34%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#080d15;flex:0 0 auto}
          .post-media-summary div{display:grid;gap:.25rem;min-width:0}
          .post-media-summary strong{color:var(--text);overflow-wrap:anywhere}
          .post-media-summary span{color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
          @media (max-width:520px){.post-media-summary{align-items:flex-start}.post-media-summary img{width:96px}}
          """)

          html = Path('control-center/index.html')
          text = html.read_text().replace('20260730.2', '20260730.3')
          html.write_text(text)

          replace('tools/test-course-video-import.mjs',
          "assert.ok(whopItems.includes('_mediaContext: mediaContext'), 'Exact course media must stay available in-memory for the media enhancer.');\n",
          "assert.ok(whopItems.includes('_mediaContext: mediaContext'), 'Exact course media must stay available in-memory for the media enhancer.');\nassert.ok(whopItems.includes('detailedCourseLesson'), 'Course scan must fetch exact video lesson details before review.');\nassert.ok(whopItems.includes('COURSE_DETAIL_CONCURRENCY = 4'), 'Exact course detail reads must remain bounded.');\nassert.ok(whopItems.includes(\"role: 'course-thumbnail'\"), 'Course review cards must receive lesson thumbnails when Whop exposes them.');\nassert.ok(whopItems.includes('duration_seconds:'), 'Course review cards must receive hosted-video duration metadata.');\n")
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run full build and regression suite
        run: npm run build
      - name: Commit exact validated implementation
        run: |
          set -euo pipefail
          rm -f package-lock.json
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore course video review and mobile rendering"
          git push origin HEAD:agent/whop-guide-importer
