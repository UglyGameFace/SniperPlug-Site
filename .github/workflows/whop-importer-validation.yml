name: Apply and verify SniperPlug R2 hard-free safeguards

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-sniperplug-r2-hard-free
  cancel-in-progress: false

jobs:
  build:
    if: github.head_ref == 'agent/whop-guide-importer'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: agent/whop-guide-importer
          fetch-depth: 0

      - name: Apply validated hard-free implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/sniperplug.patch.b64
          for sha in \
            0f8f675bae4eb1f283352d26966fe6060df91358 \
            176ee811a8bc706588cab5fd11bae8e916c17938 \
            23a16ed55e49782b85194ee6bd5b6c4f44427245 \
            628f4d04e92b3a1c9687cb1a534a611b1f7c54a6 \
            82f447d610495df027394be7fc36d2373e0569a9
          do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/git/blobs/$sha" \
              | jq -r .content | base64 -d >> /tmp/sniperplug.patch.b64
          done
          base64 -d /tmp/sniperplug.patch.b64 | bunzip2 > /tmp/sniperplug.patch
          git apply --check /tmp/sniperplug.patch
          git apply /tmp/sniperplug.patch
          rm -f .hard-free-trigger package-lock.json
          git checkout HEAD -- .github/workflows/whop-importer-validation.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run full build and regression suite
        run: npm run build

      - name: Validate migration SQL
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.executescript(Path('migrations/0003_media_hard_free.sql').read_text())
          columns = {row[1] for row in db.execute('PRAGMA table_info(media_storage_state)')}
          assert {'copy_day', 'copies_today', 'origin_reads_today'} <= columns
          assert db.execute('SELECT COUNT(*) FROM media_storage_state').fetchone()[0] == 1
          PY

      - name: Commit validated safeguards
        run: |
          set -euo pipefail
          rm -f package-lock.json
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enforce R2 hard-free media safeguards"
          git push origin HEAD:agent/whop-guide-importer
