name: Apply and verify SniperPlug video review fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-sniperplug-video-review-fix
  cancel-in-progress: false

jobs:
  build:
    if: github.head_ref == 'agent/whop-guide-importer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: agent/whop-guide-importer
          fetch-depth: 0
      - name: Apply exact validated video review patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/f0b4da5568e03d8a4c969019768a448ab8f7e117" \
            | jq -r .content | base64 -d > /tmp/sniperplug-video-review.patch.b64
          base64 -d /tmp/sniperplug-video-review.patch.b64 | bunzip2 > /tmp/sniperplug-video-review.patch
          patch -p1 --dry-run < /tmp/sniperplug-video-review.patch
          patch -p1 < /tmp/sniperplug-video-review.patch
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run full build and regression suite
        run: npm run build
      - name: Commit exact validated implementation
        run: |
          set -euo pipefail
          rm -f package-lock.json
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore course video review and mobile rendering"
          git push origin HEAD:agent/whop-guide-importer
