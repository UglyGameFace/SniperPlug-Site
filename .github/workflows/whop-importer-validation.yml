name: Package SniperPlug source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: package-sniperplug-source
  cancel-in-progress: true

jobs:
  package:
    if: github.head_ref == 'agent/whop-guide-importer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: agent/whop-guide-importer
      - name: Upload current source
        uses: actions/upload-artifact@v4
        with:
          name: sniperplug-course-video-base-${{ github.sha }}
          path: |
            .
            !.git
            !node_modules
          include-hidden-files: true
          retention-days: 1
