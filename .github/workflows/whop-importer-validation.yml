name: Apply and verify SniperPlug course video importer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-sniperplug-course-video-importer
  cancel-in-progress: false

jobs:
  build:
    if: github.head_ref == 'agent/whop-guide-importer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: agent/whop-guide-importer
          fetch-depth: 0

      - name: Apply exact validated course-video patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/sniperplug-course-video.patch.b64
          for sha in \
            26c949aad574bb6d9cd2c57b52e4541d9020d767 \
            2b7395be8acbcbcbd39c51dcb029d59449b51681 \
            bad03f891395fe450ff850d8857a50d618203dff \
            97f9fe91292a52ebb47a5484f1063b6c47e59040
          do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/git/blobs/$sha" \
              | jq -r .content | base64 -d >> /tmp/sniperplug-course-video.patch.b64
          done
          base64 -d /tmp/sniperplug-course-video.patch.b64 | bunzip2 > /tmp/sniperplug-course-video.patch
          patch -p1 --dry-run < /tmp/sniperplug-course-video.patch
          patch -p1 < /tmp/sniperplug-course-video.patch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run full build and regression suite
        run: npm run build

      - name: Validate all database migrations
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          database = sqlite3.connect(':memory:')
          for migration in sorted(Path('migrations').glob('*.sql')):
              database.executescript(migration.read_text())

          tables = {
              row[0]
              for row in database.execute("SELECT name FROM sqlite_master WHERE type = 'table'")
          }
          assert 'course_video_sources' in tables
          assert 'media_storage_state' in tables
          assert 'media_objects' in tables

          columns = {
              row[1]
              for row in database.execute('PRAGMA table_info(course_video_sources)')
          }
          assert {'video_key', 'guide_id', 'lesson_id', 'source_key', 'created_at', 'updated_at'} <= columns
          assert not {'playback_id', 'signed_playback_id', 'playback_token'} & columns
          PY

      - name: Commit exact validated implementation
        run: |
          set -euo pipefail
          rm -f package-lock.json
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore Whop course video playback and probe app capabilities"
          git push origin HEAD:agent/whop-guide-importer
