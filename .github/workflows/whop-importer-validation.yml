name: Apply and verify SniperPlug interaction repair

on:
  push:
    branches: [agent/whop-guide-importer]

permissions:
  contents: write

concurrency:
  group: apply-sniperplug-interaction-repair
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: agent/whop-guide-importer
          fetch-depth: 0

      - name: Apply validated interaction and performance repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/sniperplug.patch.b64
          for sha in \
            4e3c470cd6531665524f4a95f88a07c0fd3e8918 \
            d33e5cc1a3f97ac4cb4a8197bd4199319ee9525f \
            6330aaefa2eaece8ece1de36a58b0426cd3403cf \
            8c12d8610cc7f607b5c17a78af5ebc035ffa6ddc \
            c7ed36cba5f965be842d4c5277b4cefc2b47e276 \
            65ec3841b3331b6febf4c01fc74f27fffb634673 \
            3aa96f112db344b318ce8b49868bd818b48f08b0 \
            0d2e2c5bfa2d0d286352a05b932d14b1c3830e0d
          do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/git/blobs/$sha" \
              | jq -r .content | base64 -d >> /tmp/sniperplug.patch.b64
          done
          base64 -d /tmp/sniperplug.patch.b64 | bunzip2 > /tmp/sniperplug.patch
          git apply --check /tmp/sniperplug.patch
          git apply /tmp/sniperplug.patch

          cat > .github/workflows/whop-importer-validation.yml <<'FINAL_WORKFLOW'
          name: Verify SniperPlug

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main, agent/whop-guide-importer]

          permissions:
            contents: read

          concurrency:
            group: verify-sniperplug-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4
                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Install dependencies
                  run: npm install --ignore-scripts
                - name: Run full build and regression suite
                  run: npm run build
          FINAL_WORKFLOW

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run full build and regression suite
        run: npm run build

      - name: Commit validated repair
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Control Center interaction latency and runtime crash"
          git push origin HEAD:agent/whop-guide-importer
