name: Private Guide Preview Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: private-guide-preview-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Cloudflare branch preview and verify privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          base='https://fix-private-guides-owner-aut.sniperplug.pages.dev'
          work="${RUNNER_TEMP}/private-guide-preview"
          mkdir -p "$work"

          fail() {
            echo "::error::$1"
            exit 1
          }

          ready=false
          for attempt in $(seq 1 48); do
            code=$(curl --silent --show-error --dump-header "$work/guides.headers" --output "$work/guides.html" --write-out '%{http_code}' "$base/guides/" || true)
            if [[ "$code" == '401' ]] && grep -qi 'Unlock the private guides' "$work/guides.html"; then
              ready=true
              break
            fi
            echo "Preview not updated yet (attempt ${attempt}/48, status ${code})."
            sleep 10
          done

          [[ "$ready" == 'true' ]] || fail 'Cloudflare preview never exposed the private guide lock page.'
          tr -d '\r' < "$work/guides.headers" > "$work/guides.normalized.headers"
          grep -Eqi '^cache-control:.*private.*no-store' "$work/guides.normalized.headers" || { cat "$work/guides.normalized.headers"; fail 'Guide lock response is missing private/no-store caching.'; }
          grep -Eqi '^x-robots-tag:.*noindex.*nofollow.*noarchive' "$work/guides.normalized.headers" || { cat "$work/guides.normalized.headers"; fail 'Guide lock response is missing noindex headers.'; }
          ! grep -Eqi 'Sports betting|Casino|Auto checkout|Crypto and trading' "$work/guides.html" || fail 'The anonymous guide lock response leaked private category names.'

          home_code=$(curl --silent --show-error --output "$work/home.html" --write-out '%{http_code}' "$base/")
          [[ "$home_code" == '200' ]] || fail "Public homepage returned ${home_code}."
          ! grep -Fq 'href="/guides/"' "$work/home.html" || fail 'Public homepage still links to the private guide library.'

          sitemap_code=$(curl --silent --show-error --output "$work/sitemap.xml" --write-out '%{http_code}' "$base/sitemap.xml")
          [[ "$sitemap_code" == '200' ]] || fail "Sitemap returned ${sitemap_code}."
          ! grep -Fq '/guides/' "$work/sitemap.xml" || fail 'Public sitemap still contains private guide URLs.'

          media_code=$(curl --silent --show-error --output "$work/media.txt" --write-out '%{http_code}' "$base/media/whop-0123456789abcdef0123456789abcdef-proof.png" || true)
          [[ "$media_code" == '401' ]] || { cat "$work/media.txt"; fail "Anonymous copied-media request returned ${media_code}, not 401."; }
          grep -qi 'Control Center password' "$work/media.txt" || { cat "$work/media.txt"; fail 'Anonymous copied-media response does not explain the owner lock.'; }

          video_code=$(curl --silent --show-error --output "$work/video.html" --write-out '%{http_code}' "$base/course-video/wcv-0123456789abcdef0123456789abcdef01234567" || true)
          [[ "$video_code" == '401' ]] || { cat "$work/video.html"; fail "Anonymous course-video request returned ${video_code}, not 401."; }
          grep -qi 'Control Center' "$work/video.html" || { cat "$work/video.html"; fail 'Anonymous course-video response does not explain the owner lock.'; }
          ! grep -qi '<iframe' "$work/video.html" || fail 'Anonymous course-video response exposed a player frame.'

          echo 'Cloudflare preview privacy smoke test passed.'
