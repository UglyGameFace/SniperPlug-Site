name: Verify production owner access

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-owner-access
  cancel-in-progress: true

jobs:
  host-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record production DNS and response headers
        run: |
          set -euo pipefail
          echo '=== DNS A ==='
          dig +short A sniperplug.com || true
          echo '=== DNS AAAA ==='
          dig +short AAAA sniperplug.com || true
          echo '=== DNS CNAME ==='
          dig +short CNAME sniperplug.com || true
          echo '=== HTTPS response chain ==='
          curl --silent --show-error --location --head --max-time 30 \
            --header 'Cache-Control: no-cache, no-store' \
            "https://sniperplug.com/?production-host-diagnostic=${GITHUB_SHA}"

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for SniperPlug.com and verify owner-only guides
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          result_state='failure'
          result_description='Production owner access verification failed'

          post_status() {
            payload="$(jq -nc \
              --arg state "$result_state" \
              --arg context 'production/sniperplug-owner-access' \
              --arg description "$result_description" \
              --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}')"
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data "$payload" >/dev/null || true
          }

          result_state='pending'
          result_description='Waiting for SniperPlug.com production deployment'
          post_status
          result_state='failure'
          result_description='Production owner access verification failed'
          trap post_status EXIT

          homepage=''
          for attempt in $(seq 1 60); do
            homepage="$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store' \
              "https://sniperplug.com/?production-owner-access=${GITHUB_SHA}-${attempt}" || true)"

            if grep -Fq 'href="/control-center/"' <<<"$homepage" \
              && grep -Fq '>Owner access</a>' <<<"$homepage" \
              && ! grep -Fq 'href="/guides/"' <<<"$homepage"; then
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo 'SniperPlug.com never deployed the Owner access navigation or still exposed Guides publicly.' >&2
              exit 1
            fi
            sleep 10
          done

          control_center="$(curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache, no-store' \
            "https://sniperplug.com/control-center/?production-owner-access=${GITHUB_SHA}")"
          grep -Fq 'Unlock the Guide Control Center.' <<<"$control_center"
          grep -Fq 'Private guides' <<<"$control_center"

          guide_body="$(mktemp)"
          guide_status="$(curl --silent --show-error --location \
            --header 'Cache-Control: no-cache, no-store' \
            --output "$guide_body" \
            --write-out '%{http_code}' \
            "https://sniperplug.com/guides/?production-owner-access=${GITHUB_SHA}")"
          test "$guide_status" = '401'
          grep -Fq 'same password you already use for the SniperPlug Control Center' "$guide_body"

          sitemap="$(curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache, no-store' \
            "https://sniperplug.com/sitemap.xml?production-owner-access=${GITHUB_SHA}")"
          if grep -Fq '/guides/' <<<"$sitemap"; then
            echo 'Private guide URLs remain in the production sitemap.' >&2
            exit 1
          fi

          result_state='success'
          result_description='Owner access and private guide lock are live'
          echo 'SniperPlug.com production owner access verification passed.'
