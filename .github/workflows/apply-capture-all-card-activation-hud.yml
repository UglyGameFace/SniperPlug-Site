name: Apply Capture-all card traversal and HUD fix

on:
  push:
    branches:
      - fix/capture-all-card-activation-hud

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capture-all-card-activation-hud
          fetch-depth: 0
      - name: Apply staged implementation
        shell: bash
        run: |
          git show a46573cee1adfd70e03ccf0e1696eaefa9e0ae91:.github/workflows/apply-capture-all-card-activation-hud.yml > /tmp/staged-workflow.yml
          python -c 'from pathlib import Path; t=Path("/tmp/staged-workflow.yml").read_text(); m="          python - <<'"'"'PY'"'"'\n"; s=t.index(m)+len(m); e=t.index("\n          PY\n",s); b=t[s:e]; Path("/tmp/apply.py").write_text("\n".join((x[10:] if x.startswith("          ") else x) for x in b.splitlines())+"\n")'
          python /tmp/apply.py
          git config user.name 'SniperPlug CI Fixer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix click-only Capture-all traversal and HUD controls'
          git push origin HEAD:fix/capture-all-card-activation-hud
