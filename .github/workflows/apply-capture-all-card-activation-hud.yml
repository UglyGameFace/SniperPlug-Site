name: Apply Capture-all card traversal and HUD fix

on:
  push:
    branches:
      - fix/capture-all-card-activation-hud

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capture-all-card-activation-hud
          fetch-depth: 0
      - name: Apply Capture-all runtime fix
        shell: bash
        run: |
          git show a46573cee1adfd70e03ccf0e1696eaefa9e0ae91:.github/workflows/apply-capture-all-card-activation-hud.yml > /tmp/staged-workflow.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/staged-workflow.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          body = text[start:end]
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply.py').write_text('\n'.join(lines) + '\n')
          PY
          python /tmp/apply.py

          python - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: refinement match count {count}')
              p.write_text(text.replace(old, new))

          capture = 'browser-extension/content-capture.js'
          background = 'browser-extension/background.js'

          once(
              capture,
              "const interactive = element.matches('button,[role=\"button\"],[tabindex]:not([tabindex=\"-1\"])') || style.cursor === 'pointer';",
              "const interactive = element.matches('button,[role=\"button\"],[role=\"link\"],[tabindex]:not([tabindex=\"-1\"])') || style.cursor === 'pointer';",
          )
          once(
              capture,
              "      const style = getComputedStyle(element);\n      const interactive = element.matches('button,[role=\"button\"],[role=\"link\"],[tabindex]:not([tabindex=\"-1\"])') || style.cursor === 'pointer';",
              "      const rawLabel = normalizeSpace(element.getAttribute('aria-label') || element.getAttribute('title') || element.innerText || element.textContent);\n      if (!rawLabel || rawLabel.length > 220) continue;\n      const style = getComputedStyle(element);\n      const interactive = element.matches('button,[role=\"button\"],[role=\"link\"],[tabindex]:not([tabindex=\"-1\"])') || style.cursor === 'pointer';",
          )

          once(
              background,
              "async function classifySyncCapture(tabId, capture) {\n  const key = stablePageKey(capture);",
              "async function classifySyncCapture(tabId, capture, stableKeyOverride = '') {\n  const key = String(stableKeyOverride || '').trim() || stablePageKey(capture);",
          )
          once(
              background,
              "  const identity = captureIdentity(capture);\n  const fingerprint = options.fingerprint || await captureFingerprint(capture);",
              "  const identity = String(options.stableKey || '').trim() || captureIdentity(capture);\n  const fingerprint = options.fingerprint || await captureFingerprint(capture);",
          )

          once(
              background,
              "    state.lastPageUrl = seed.toString();\n    state.autoSend = options.autoSend === true ? true : state.autoSend === true;",
              "    state.lastPageUrl = seed.toString();\n    state.lastPageDirectoryLike = true;\n    state.lastPageTitle = '';\n    state.autoSend = options.autoSend === true ? true : state.autoSend === true;",
          )
          once(
              background,
              "      lastPageUrl: seed.toString(),\n      scope,",
              "      lastPageUrl: seed.toString(),\n      lastPageDirectoryLike: true,\n      lastPageTitle: '',\n      scope,",
          )
          once(
              background,
              "  const shouldActivate = target.activation === true && parentUrl && currentPageUrl === parentUrl;",
              "  const shouldActivate = target.activation === true && parentUrl && currentPageUrl === parentUrl && state.lastPageDirectoryLike === true;",
          )

          once(
              background,
              "    clearTraversalTimer(state);\n    state.status = 'running';",
              "    state.status = 'running';",
          )
          once(
              background,
              "    state.lastPageUrl = pageUrl;\n    const targetSignature =",
              "    state.lastPageUrl = pageUrl;\n    state.lastPageDirectoryLike = snapshot?.directoryLike === true;\n    state.lastPageTitle = String(snapshot?.title || '').slice(0, 180);\n    const targetSignature =",
          )
          once(
              background,
              "    if (snapshotKey === state.lastSnapshotKey) return { ignored: true, ...traversalPublicState(state) };\n    state.lastSnapshotKey = snapshotKey;",
              "    if (snapshotKey === state.lastSnapshotKey) return { ignored: true, ...traversalPublicState(state) };\n    clearTraversalTimer(state);\n    state.lastSnapshotKey = snapshotKey;",
          )
          once(
              background,
              "    if (activationTarget?.stage === 'returning' && activationParent && pageUrl === activationParent) {",
              "    if (activationTarget?.stage === 'returning' && activationParent && pageUrl === activationParent && snapshot?.directoryLike === true) {",
          )
          once(
              background,
              "      await saveTraversal(state);\n      return { waitingForActivation: true, ...traversalPublicState(state) };",
              "      await saveTraversal(state);\n      scheduleTraversalTimeout(state);\n      return { waitingForActivation: true, ...traversalPublicState(state) };",
          )

          old = """    if (snapshot?.capture && snapshot?.directoryLike !== true) {
      try {
        const classified = await classifySyncCapture(tabId, snapshot.capture);
        if (classified.action === 'new' || classified.action === 'changed') {
          await addCapture(tabId, snapshot.capture, {
            fingerprint: classified.fingerprint,
            changeType: classified.action,
          });
"""
          new = """    if (snapshot?.capture && snapshot?.directoryLike !== true) {
      try {
        const activationStableKey = matchedTarget?.activation === true ? matchedTarget.url : '';
        const captureToQueue = matchedTarget?.activation === true
          ? {
            ...snapshot.capture,
            pageIdentity: `${matchedTarget.url}|${String(snapshot.capture.title || matchedTarget.title || '').slice(0, 140)}`.slice(0, 600),
          }
          : snapshot.capture;
        const classified = await classifySyncCapture(tabId, captureToQueue, activationStableKey);
        if (classified.action === 'new' || classified.action === 'changed') {
          await addCapture(tabId, captureToQueue, {
            stableKey: activationStableKey,
            fingerprint: classified.fingerprint,
            changeType: classified.action,
          });
"""
          once(background, old, new)

          test = Path('tools/test-browser-click-card-traversal.mjs')
          text = test.read_text()
          insert = """
assert.ok(capture.includes('[role=\\\"link\\\"]'), 'Role-link click cards are not recognized.');
assert.ok(background.includes('state.lastPageDirectoryLike === true'), 'Same-URL SPA details can be mistaken for their parent directory.');
assert.ok(background.includes('stableKeyOverride') && background.includes('activationStableKey') && background.includes('captureToQueue'), 'Same-URL click guides can collapse into one queue identity.');
assert.ok(background.includes('waitingForActivation') && background.includes('scheduleTraversalTimeout(state);'), 'An unchanged card activation can lose its bounded retry timer.');
"""
          marker = "console.log('BROWSER CLICK-CARD TRAVERSAL + HUD REGRESSION: PASS');"
          if marker not in text:
              raise SystemExit('Click-card regression marker missing.')
          test.write_text(text.replace(marker, insert + '\n' + marker))
          PY

          git config user.name 'SniperPlug CI Fixer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix click-only Capture-all traversal and HUD controls'
          git push origin HEAD:fix/capture-all-card-activation-hud
