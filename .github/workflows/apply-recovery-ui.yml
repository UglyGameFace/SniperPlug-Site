name: Apply recovery UI truth

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-recovery-ui-truth
  cancel-in-progress: false

jobs:
  build:
    if: github.head_ref == 'agent/whop-guide-importer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/whop-guide-importer
          fetch-depth: 0
      - name: Apply exact implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new))

          replace('assets/js/control-center-v2.js',
          "      empty.textContent = 'No reversible bulk publications from the last 48 hours.';",
          "      empty.textContent = 'No reversible published or rejected imported guides from the last 48 hours.';")

          replace('assets/js/control-center-v2.js',
          "    if (all && !window.confirm('Undo every reversible bulk publication from the last 48 hours? The guides will return to private drafts and any active bulk job will be canceled.')) return;",
          "    if (all && !window.confirm('Restore every reversible published or rejected imported guide from the last 48 hours? They will return to private drafts and any active bulk job will be canceled.')) return;")

          replace('assets/js/control-center-v2.js',
          "      status.textContent = action.reversible ? 'Published' : action.status;",
          "      status.textContent = action.status === 'rejected' ? 'Rejected · can restore' : action.status === 'published' ? 'Published · can undo' : action.status;")

          replace('control-center/index.html',
          '<header><div><h3>Undo recent bulk publications</h3><p>For 48 hours, return all or selected bulk-published guides to private drafts. Undo never deletes the content.</p></div></header>',
          '<header><div><h3>Restore recent imported changes</h3><p>For 48 hours, return published guides or rejected imported guides to private drafts. Restore never deletes the content.</p></div></header>')

          html = Path('control-center/index.html')
          text = html.read_text()
          if '20260730.6' not in text:
              raise SystemExit('expected Control Center asset version 20260730.6')
          html.write_text(text.replace('20260730.6', '20260730.7'))

          test = Path('tools/audit-import-quality-recovery.mjs')
          text = test.read_text()
          text = text.replace("const page = read('control-center/index.html');\n", "const page = read('control-center/index.html');\nconst recent = read('functions/_lib/recent-actions.js');\nconst runtime = read('assets/js/control-center-v2.js');\n")
          marker = "assert.ok(imports.includes('MAX_ATTACHMENTS_PER_AUTOMATIC_ITEM'), 'Attachment-heavy content can still exceed a bounded automatic step.');\n"
          addition = marker + "assert.ok(imports.includes(\"existing.status !== 'rejected'\"), 'Rejected imported guides are still mistaken for unchanged and cannot be re-imported.');\nassert.ok(recent.includes(\"status = 'rejected'\") && recent.includes(\"status IN ('published', 'rejected')\"), 'Rejected imported guides are missing from 48-hour restore or cannot return to draft.');\nassert.ok(runtime.includes('Rejected · can restore') && runtime.includes('published or rejected imported guides'), 'The Undo panel still mislabels rejected-guide restoration as publication-only.');\nassert.ok(page.includes('Restore recent imported changes'), 'The Control Center does not explain that rejected imports can be restored.');\n"
          if marker not in text:
              raise SystemExit('audit insertion marker missing')
          test.write_text(text.replace(marker, addition))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Run full build and regression suite
        run: npm run build
      - name: Commit validated implementation
        run: |
          rm -f package-lock.json
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore rejected imports and clarify undo state"
          git push origin HEAD:agent/whop-guide-importer
