name: Owner hardening preview smoke

on:
  push:
    branches: [fix/production-owner-access-hardening]

permissions:
  contents: read
  statuses: write

concurrency:
  group: owner-hardening-preview-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed private login and video recovery
        env:
          PREVIEW_URL: https://fix-production-owner-access.sniperplug.pages.dev
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          result_state='failure'
          result_description='Owner hardening preview verification failed'
          post_status() {
            payload="$(jq -nc \
              --arg state "$result_state" \
              --arg context 'preview/owner-hardening' \
              --arg description "$result_description" \
              --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}')"
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data "$payload" >/dev/null || true
          }
          result_state='pending'
          result_description='Waiting for Cloudflare branch deployment'
          post_status
          result_state='failure'
          result_description='Owner hardening preview verification failed'
          trap post_status EXIT

          homepage=''
          for attempt in $(seq 1 45); do
            homepage="$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store' \
              "${PREVIEW_URL}/?owner-hardening=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq '>Owner access</a>' <<<"$homepage" \
              && ! grep -Fq 'href="/guides/"' <<<"$homepage"; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo 'Cloudflare branch preview did not deploy Owner access safely.' >&2
              exit 1
            fi
            sleep 10
          done

          guide_body="$(mktemp)"
          guide_status="$(curl --silent --show-error --location \
            --header 'Cache-Control: no-cache, no-store' \
            --output "$guide_body" --write-out '%{http_code}' \
            "${PREVIEW_URL}/guides/?owner-hardening=${GITHUB_SHA}")"
          test "$guide_status" = '401'
          grep -Fq '<form method="post" action="/api/control?action=session" data-private-guide-login-form>' "$guide_body"
          grep -Fq '<noscript>' "$guide_body"
          if grep -Eq '<form(?![^>]*method="post")[^>]*data-private-guide-login-form' "$guide_body"; then
            echo 'Private guide fallback form can still submit the password through GET.' >&2
            exit 1
          fi

          video_body="$(mktemp)"
          video_status="$(curl --silent --show-error --location \
            --header 'Cache-Control: no-cache, no-store' \
            --output "$video_body" --write-out '%{http_code}' \
            "${PREVIEW_URL}/course-video/not-a-real-owner-video?owner-hardening=${GITHUB_SHA}")"
          test "$video_status" = '401'
          grep -Fq 'Open Owner access to unlock the private library' "$video_body"
          if grep -Fq 'reconnect Whop' "$video_body"; then
            echo 'Owner authorization failure is still mislabeled as a Whop reconnect error.' >&2
            exit 1
          fi

          result_state='success'
          result_description='Owner login and video recovery are safe on preview'
