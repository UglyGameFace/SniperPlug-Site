name: Verify affiliate-ready preview

on:
  pull_request:
    paths:
      - 'index.html'
      - '404.html'
      - '_headers'
      - 'deals/**'
      - 'deal/**'
      - 'about/**'
      - 'partners/**'
      - 'contact/**'
      - 'privacy/**'
      - 'terms/**'
      - 'affiliate-disclosure/**'
      - 'assets/css/**'
      - 'assets/js/site.js'
      - 'assets/sniperplug-logo-exact.svg'
      - 'data/deals.json'
      - 'functions/_lib/private-guides.js'
      - 'functions/_lib/templates.js'
      - 'functions/deal/**'
      - 'functions/go/**'
      - 'functions/sitemap.xml.js'
      - 'package.json'
      - 'tools/audit-homepage.mjs'
      - 'tools/audit-public-theme.mjs'
      - '.github/workflows/affiliate-preview-smoke.yml'

permissions:
  contents: read

concurrency:
  group: affiliate-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Cloudflare preview and inspect the full visual shell
        env:
          HEAD_REF: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          alias="$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-|-$//g')"
          alias="${alias:0:28}"
          base="https://${alias}.sniperplug.pages.dev"
          echo "Checking ${base}"

          ready=0
          for attempt in $(seq 1 36); do
            nonce="${COMMIT_SHA}-${attempt}-$(date +%s)"
            page_code="$(curl --silent --show-error --max-time 25 --output deals-ready.html --write-out '%{http_code}' "${base}/deals/?preview=${nonce}" || true)"
            runtime_code="$(curl --silent --show-error --max-time 25 --output site-runtime.js --write-out '%{http_code}' "${base}/assets/js/site.js?preview=${nonce}" || true)"
            base_css_code="$(curl --silent --show-error --max-time 25 --output base-theme.css --write-out '%{http_code}' "${base}/assets/css/styles.css?preview=${nonce}" || true)"
            shell_code="$(curl --silent --show-error --max-time 25 --output site-shell.css --write-out '%{http_code}' "${base}/assets/css/site-shell.css?preview=${nonce}" || true)"
            logo_code="$(curl --silent --show-error --max-time 25 --dump-header exact-logo.headers --output exact-logo.svg --write-out '%{http_code}' "${base}/assets/sniperplug-logo-exact.svg?preview=${nonce}" || true)"
            if [ "$page_code" = '200' ] \
              && [ "$runtime_code" = '200' ] \
              && [ "$base_css_code" = '200' ] \
              && [ "$shell_code" = '200' ] \
              && [ "$logo_code" = '200' ] \
              && grep -Fq 'No verified public deal cards are active.' deals-ready.html \
              && grep -Fq "@import url('/assets/css/site-shell.css');" base-theme.css \
              && grep -Fq "sniperplug-logo-exact.svg" site-shell.css \
              && grep -Fq '<title id="title">SniperPlug logo</title>' exact-logo.svg \
              && grep -Fq 'data:image/png;base64,' site-runtime.js \
              && grep -Fq "mark.dataset.brandArtwork = 'owner-approved-exact'" site-runtime.js; then
              ready=1
              break
            fi
            echo "Attempt ${attempt}: page=${page_code} runtime=${runtime_code} base=${base_css_code} shell=${shell_code} logo=${logo_code}; waiting for the unified preview."
            sleep 20
          done

          if [ "$ready" -ne 1 ]; then
            echo '::error::Cloudflare branch preview did not deploy the unified visual build before timeout.'
            sed -n '1,120p' deals-ready.html 2>/dev/null || true
            sed -n '1,80p' base-theme.css 2>/dev/null || true
            sed -n '1,80p' site-shell.css 2>/dev/null || true
            exit 1
          fi

          banned='Launch example|Seed example|sample item|starter policy|replace .*before public launch|\$89\.00|\$179\.00|\$297\.00|\$399\.00'
          check_page() {
            path="$1"
            marker="$2"
            output="$3"
            code="$(curl --silent --show-error --location --max-time 25 --output "$output" --write-out '%{http_code}' "${base}${path}?preview=${COMMIT_SHA}" || true)"
            test "$code" = '200'
            grep -Fiq "$marker" "$output"
            ! grep -Eiq "$banned" "$output"
          }

          check_shell_page() {
            path="$1"
            marker="$2"
            output="$3"
            check_page "$path" "$marker" "$output"
            grep -Eq '<link rel="stylesheet" href="/assets/css/styles.css([^" ]*)?">' "$output"
            grep -Fq 'class="site-header"' "$output"
            grep -Fq 'class="brand-mark"' "$output"
            grep -Fq 'class="site-footer"' "$output"
          }

          check_marketing_page() {
            path="$1"
            marker="$2"
            output="$3"
            check_shell_page "$path" "$marker" "$output"
            grep -Fq '<link rel="stylesheet" href="/assets/css/homepage.css">' "$output"
            test "$(grep -Fc '/assets/css/homepage.css' "$output")" = '1'
          }

          check_marketing_page '/' 'No exact destination means no public deal card.' homepage.html
          check_marketing_page '/deals/' 'No verified public deal cards are active.' deals.html
          check_marketing_page '/deals/walmart/' 'No verified Walmart deal cards are currently published.' walmart.html
          check_marketing_page '/deals/lowes/' 'No verified Lowe’s deal cards are active.' lowes.html
          check_marketing_page '/deals/best-buy/' 'No verified Best Buy deal cards are active.' bestbuy.html
          check_marketing_page '/deals/home-depot/' 'No verified Home Depot deal cards are active.' homedepot.html
          check_marketing_page '/deals/amazon/' 'No verified Amazon deal cards are active.' amazon.html
          check_marketing_page '/about/' 'Deal discovery with exact-offer discipline.' about.html
          check_marketing_page '/partners/' 'Exact deep links' partners.html
          check_marketing_page '/contact/' 'Reach SniperPlug directly.' contact.html
          check_shell_page '/privacy/' 'Sessions, cookies, and local storage' privacy.html
          check_shell_page '/affiliate-disclosure/' 'Editorial and verification independence' disclosure.html
          check_shell_page '/terms/' 'Authorized private tools' terms.html

          missing_code="$(curl --silent --show-error --max-time 25 --output missing.html --write-out '%{http_code}' "${base}/definitely-not-a-real-sniperplug-route-${COMMIT_SHA}" || true)"
          test "$missing_code" = '404'
          grep -Fq 'That page slipped away.' missing.html
          grep -Fq 'class="site-header"' missing.html
          grep -Fq 'class="site-footer"' missing.html
          grep -Fq 'class="error-card"' missing.html

          grep -Fq "@import url('/assets/css/site-shell.css');" base-theme.css
          grep -Fq '.brand-mark{' site-shell.css
          grep -Fq 'sniperplug-logo-exact.svg' site-shell.css
          grep -Fq '.page-hero{position:relative' site-shell.css
          grep -Fq '.legal-card{max-width:980px' site-shell.css
          grep -Fq '.error-shell{' site-shell.css
          grep -Fq '@media(max-width:700px)' site-shell.css

          curl --silent --show-error --max-time 25 "${base}/assets/css/homepage.css?preview=${COMMIT_SHA}" > marketing-theme.css
          grep -Fq '.section-soft{' marketing-theme.css
          grep -Fq '.capability-grid{' marketing-theme.css
          grep -Fq '.capability-card{' marketing-theme.css
          grep -Fq '@media(max-width:700px)' marketing-theme.css
          ! grep -Fq 'sniperplug-logo-exact.svg' marketing-theme.css

          grep -Fiq 'cache-control: public, max-age=0, must-revalidate' exact-logo.headers
          grep -Fq "document.querySelectorAll('.brand-mark')" site-runtime.js
          grep -Fq "logo.style.objectFit = 'contain'" site-runtime.js
          grep -Fq "logo.style.aspectRatio = '1 / 1'" site-runtime.js
          grep -Fq "mark.dataset.brandArtwork = 'owner-approved-exact'" site-runtime.js
          grep -Fq 'mark.replaceChildren(logo)' site-runtime.js

          python3 - <<'PY'
          import base64, hashlib, re, struct
          expected = '3df6e4d5fc89940a406c2a938c1e30d23e8e96ed54fc5328386d82e780a5fd86'
          for filename, pattern in [
              ('site-runtime.js', r"data:image/png;base64,([A-Za-z0-9+/='\",\s]+?)',\s*\]"),
              ('exact-logo.svg', r'href="data:image/png;base64,([A-Za-z0-9+/=]+)"'),
          ]:
              text = open(filename, encoding='utf-8').read()
              match = re.search(pattern, text, re.S)
              if not match:
                  raise SystemExit(f'exact PNG not found in {filename}')
              encoded = re.sub(r"['\",\s]", '', match.group(1))
              image = base64.b64decode(encoded, validate=True)
              if image[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{filename} logo is not PNG')
              width, height = struct.unpack('>II', image[16:24])
              if (width, height) != (96, 96):
                  raise SystemExit(f'{filename} logo is {width}x{height}, expected 96x96')
              digest = hashlib.sha256(image).hexdigest()
              if digest != expected:
                  raise SystemExit(f'{filename} logo checksum changed: {digest}')
          PY

          retired_code="$(curl --silent --show-error --location --max-time 25 --output retired.html --write-out '%{http_code}' "${base}/deal/walmart-shark-navigator-vacuum/?preview=${COMMIT_SHA}" || true)"
          test "$retired_code" = '200'
          grep -Fq 'Only confirmed offers belong here.' retired.html
          ! grep -Eiq 'Shark Navigator|\$89\.00|Launch example|sample item' retired.html

          curl --silent --show-error --max-time 25 "${base}/sitemap.xml?preview=${COMMIT_SHA}" > sitemap.xml
          grep -Fq '<loc>https://sniperplug.com/deals/</loc>' sitemap.xml
          ! grep -Fq '<loc>https://sniperplug.com/deal/' sitemap.xml

          echo 'Affiliate-ready Cloudflare preview and the full unified visual route surface passed.'
