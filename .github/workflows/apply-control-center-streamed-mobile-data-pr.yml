name: Apply Control Center streamed mobile data on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute embedded repair patch
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-control-center-streamed-mobile-data.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          body = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          exec(compile('\n'.join(lines) + '\n', 'embedded-streamed-mobile-patch.py', 'exec'))
          PY
      - name: Repair generated audit quote escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/audit-control-mobile-flow.mjs')
          text = path.read_text()
          bad = "assert.ok(control.includes('action=post-detail') && control.includes('typeof exact.body !== 'string''));"
          good = "assert.ok(control.includes('action=post-detail') && control.includes(\"typeof exact.body !== 'string'\"));"
          if bad not in text:
              raise SystemExit('generated audit quote anchor missing')
          path.write_text(text.replace(bad, good, 1))
          PY
      - name: Sync existing performance assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/audit-control-performance-media.mjs')
          text = path.read_text()
          old_posts = "assert.ok(runtime.includes('POST_PAGE_SIZE = 10') && runtime.includes(\"dataset.action = 'post-load-more'\") && runtime.includes('state.postRenderLimit'), 'Large content scans do not stay behind explicit bounded pagination.');"
          new_posts = "assert.ok(runtime.includes('POST_PAGE_SIZE = MOBILE_QUERY.matches ? 4 : 10') && runtime.includes(\"dataset.action = 'post-load-more'\") && runtime.includes('state.postRenderLimit'), 'Large content scans do not stay behind explicit bounded pagination.');"
          old_guides = "assert.ok(runtime.includes('GUIDE_PAGE_SIZE = 24') && runtime.includes('filteredGuideIds') && runtime.includes('guide-load-more'), 'The review queue still renders every guide at once.');"
          new_guides = "assert.ok(runtime.includes('GUIDE_PAGE_SIZE = MOBILE_QUERY.matches ? 8 : 24') && runtime.includes('filteredGuideIds') && runtime.includes('guide-load-more'), 'The review queue still renders every guide at once.');"
          if old_posts not in text or old_guides not in text:
              raise SystemExit('performance pagination assertion anchor missing')
          path.write_text(text.replace(old_posts, new_posts, 1).replace(old_guides, new_guides, 1))
          PY
      - name: Validate streamed mobile data repair
        run: |
          node --check assets/js/control-center-v2.js
          node --check functions/api/control.js
          node --check functions/_lib/posts.js
          node tools/audit-control-mobile-flow.mjs
          npm run build
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACTIVE_TASK.md assets/js/control-center-v2.js control-center/index.html functions/api/control.js functions/_lib/posts.js tools/audit-control-mobile-flow.mjs tools/audit-control-performance-media.mjs
          if git diff --cached --quiet; then
            echo "No streamed mobile data changes required"
            exit 0
          fi
          git commit -m "Stream lightweight Control Center review data"
          git push
