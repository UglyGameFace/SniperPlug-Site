name: Apply incomplete Whop backup cleanup

on:
  push:
    branches:
      - feat/whop-backup-reset-restore
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'feat/whop-backup-reset-restore')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/whop-backup-reset-restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply incomplete backup cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('functions/_lib/whop-backups.js')
          service = service_path.read_text()
          old = """export async function deleteWhopImportBackup(env, backupId, confirmation) {\n  const verified = await verifyBackup(env, backupId);\n  const expected = deleteBackupConfirmationPhrase(backupId);\n  if (String(confirmation || '').trim() !== expected) throw new HttpError(422, `Type “${expected}” exactly to delete this backup.`);\n  const result = await verified.db.prepare(`\n    UPDATE whop_import_backups\n    SET deleted_at = ?, reset_token_hash = NULL, reset_token_expires_at = NULL\n    WHERE backup_id = ? AND status = 'verified' AND deleted_at IS NULL\n  `).bind(nowIso(), backupId).run();\n  if (changes(result) !== 1) throw new HttpError(409, 'SniperPlug could not delete this backup safely.');\n  return { deleted: true, backupId, archiveCleanup: 'grace-period' };\n}\n"""
          new = """export async function deleteWhopImportBackup(env, backupId, confirmation) {\n  const db = await ensureWhopBackupSchema(env);\n  const row = await backupRow(db, backupId);\n  const expected = deleteBackupConfirmationPhrase(backupId);\n  if (String(confirmation || '').trim() !== expected) throw new HttpError(422, `Type “${expected}” exactly to delete this backup.`);\n  const result = await db.prepare(`\n    UPDATE whop_import_backups\n    SET deleted_at = ?, reset_token_hash = NULL, reset_token_expires_at = NULL\n    WHERE backup_id = ? AND deleted_at IS NULL\n  `).bind(nowIso(), backupId).run();\n  if (changes(result) !== 1) throw new HttpError(409, 'SniperPlug could not delete this backup safely.');\n  return {\n    deleted: true,\n    backupId,\n    previousStatus: row.status,\n    archiveCleanup: row.archive_key ? 'grace-period' : 'none',\n  };\n}\n"""
          if new not in service:
              if old not in service:
                  raise SystemExit('service delete anchor missing')
              service = service.replace(old, new, 1)
          service_path.write_text(service)

          client_path = Path('assets/js/control-center-whop-backups.js')
          client = client_path.read_text()
          old = """        ${backup.status === 'verified' ? `\n          <div class=\"button-row\">\n            <a class=\"btn ghost\" href=\"${escapeHtml(backup.downloadUrl)}\" data-backup-download>Download JSON</a>\n            <button class=\"btn ghost\" type=\"button\" data-backup-restore=\"${escapeHtml(backup.backupId)}\">Restore</button>\n            <button class=\"decision disapprove\" type=\"button\" data-backup-delete=\"${escapeHtml(backup.backupId)}\">Delete backup</button>\n          </div>` : '<small>This incomplete backup cannot be downloaded, restored, or used for reset.</small>'}\n"""
          new = """        ${backup.status === 'verified' ? `\n          <div class=\"button-row\">\n            <a class=\"btn ghost\" href=\"${escapeHtml(backup.downloadUrl)}\" data-backup-download>Download JSON</a>\n            <button class=\"btn ghost\" type=\"button\" data-backup-restore=\"${escapeHtml(backup.backupId)}\">Restore</button>\n            <button class=\"decision disapprove\" type=\"button\" data-backup-delete=\"${escapeHtml(backup.backupId)}\">Delete backup</button>\n          </div>` : `\n          <div class=\"whop-backup-incomplete\">\n            <small>This incomplete backup cannot be downloaded, restored, or used for reset.</small>\n            <button class=\"decision disapprove\" type=\"button\" data-backup-delete=\"${escapeHtml(backup.backupId)}\">Delete incomplete backup</button>\n          </div>`}\n"""
          if new not in client:
              if old not in client:
                  raise SystemExit('client action anchor missing')
              client = client.replace(old, new, 1)
          client_path.write_text(client)

          css_path = Path('assets/css/whop-backups.css')
          css = css_path.read_text()
          if '.whop-backup-incomplete {' not in css:
              css += """\n.whop-backup-incomplete {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: .75rem;\n  flex-wrap: wrap;\n}\n\n.whop-backup-incomplete small {\n  flex: 1 1 260px;\n}\n"""
          css_path.write_text(css)

          audit_path = Path('tools/audit-whop-backups.mjs')
          audit = audit_path.read_text()
          anchor = "assert.ok(service.includes('SET deleted_at = ?') && service.includes(\"archiveCleanup: 'grace-period'\"));\n"
          replacement = """assert.ok(service.includes('SET deleted_at = ?') && service.includes("row.archive_key ? 'grace-period' : 'none'"));\nassert.ok(service.includes('const row = await backupRow(db, backupId)'));\nassert.ok(!service.includes("WHERE backup_id = ? AND status = 'verified' AND deleted_at IS NULL"));\n"""
          if replacement not in audit:
              if anchor not in audit:
                  raise SystemExit('audit service anchor missing')
              audit = audit.replace(anchor, replacement, 1)
          client_anchor = "assert.ok(client.includes(\"backup.status === 'verified'\") && client.includes('quiet: true, force: true'));\n"
          client_replacement = client_anchor + "assert.ok(client.includes('Delete incomplete backup') && client.includes('whop-backup-incomplete'));\n"
          if "client.includes('Delete incomplete backup')" not in audit:
              if client_anchor not in audit:
                  raise SystemExit('audit client anchor missing')
              audit = audit.replace(client_anchor, client_replacement, 1)
          audit_path.write_text(audit)
          PY
      - name: Validate changed paths
        run: |
          node --check functions/_lib/whop-backups.js
          node --check assets/js/control-center-whop-backups.js
          node tools/audit-whop-backups.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_lib/whop-backups.js assets/js/control-center-whop-backups.js assets/css/whop-backups.css tools/audit-whop-backups.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Allow cleanup of incomplete Whop backups"
          git push
