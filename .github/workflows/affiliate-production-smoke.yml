name: Verify affiliate-ready production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: affiliate-production-readiness
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Pages production and verify the full visual route surface
        id: verify
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pages='https://sniperplug.pages.dev'
          custom='https://sniperplug.com'
          banned='Launch example|Seed example|sample item|starter policy|replace .*before public launch|\$89\.00|\$179\.00|\$297\.00|\$399\.00'

          ready=0
          for attempt in $(seq 1 36); do
            nonce="${COMMIT_SHA}-${attempt}-$(date +%s)"
            page_code="$(curl --silent --show-error --max-time 25 --output deals-ready.html --write-out '%{http_code}' "${pages}/deals/?production=${nonce}" || true)"
            runtime_code="$(curl --silent --show-error --max-time 25 --output site-runtime.js --write-out '%{http_code}' "${pages}/assets/js/site.js?production=${nonce}" || true)"
            aggregator_code="$(curl --silent --show-error --max-time 25 --output styles.css --write-out '%{http_code}' "${pages}/assets/css/styles.css?production=${nonce}" || true)"
            foundation_code="$(curl --silent --show-error --max-time 25 --output site-base.css --write-out '%{http_code}' "${pages}/assets/css/site-base.css?production=${nonce}" || true)"
            shell_code="$(curl --silent --show-error --max-time 25 --output site-shell.css --write-out '%{http_code}' "${pages}/assets/css/site-shell.css?production=${nonce}" || true)"
            logo_code="$(curl --silent --show-error --max-time 25 --dump-header exact-logo.headers --output exact-logo.png --write-out '%{http_code}' "${pages}/assets/sniperplug-logo-exact.png?production=${nonce}" || true)"
            if [ "$page_code" = '200' ] \
              && [ "$runtime_code" = '200' ] \
              && [ "$aggregator_code" = '200' ] \
              && [ "$foundation_code" = '200' ] \
              && [ "$shell_code" = '200' ] \
              && [ "$logo_code" = '200' ] \
              && grep -Fq 'No verified public deal cards are active.' deals-ready.html \
              && grep -Fq "@import url('/assets/css/site-base.css');" styles.css \
              && grep -Fq "@import url('/assets/css/site-shell.css');" styles.css \
              && grep -Fq -- '--brand:#68e384' site-base.css \
              && grep -Fq 'sniperplug-logo-exact.png' site-shell.css \
              && grep -Fq 'data:image/png;base64,' site-runtime.js \
              && grep -Fq "mark.dataset.brandArtwork = 'owner-approved-exact'" site-runtime.js \
              && ! grep -Eiq "$banned" deals-ready.html; then
              ready=1
              break
            fi
            echo "Attempt ${attempt}: page=${page_code} runtime=${runtime_code} aggregator=${aggregator_code} base=${foundation_code} shell=${shell_code} logo=${logo_code}; waiting for the unified main deployment."
            sleep 20
          done
          if [ "$ready" -ne 1 ]; then
            echo '::error::Pages production never served the unified affiliate-ready deployment.'
            sed -n '1,140p' deals-ready.html 2>/dev/null || true
            sed -n '1,40p' styles.css 2>/dev/null || true
            sed -n '1,80p' site-shell.css 2>/dev/null || true
            exit 1
          fi

          check_page() {
            path="$1"
            marker="$2"
            output="$3"
            code="$(curl --silent --show-error --location --max-time 25 --output "$output" --write-out '%{http_code}' "${pages}${path}?production=${COMMIT_SHA}" || true)"
            test "$code" = '200'
            grep -Fiq "$marker" "$output"
            ! grep -Eiq "$banned" "$output"
          }

          check_shell_page() {
            path="$1"
            marker="$2"
            output="$3"
            check_page "$path" "$marker" "$output"
            grep -Eq '<link rel="stylesheet" href="/assets/css/styles.css([^" ]*)?">' "$output"
            grep -Fq 'class="site-header"' "$output"
            grep -Fq 'class="brand-mark"' "$output"
            grep -Fq 'class="site-footer"' "$output"
          }

          check_marketing_page() {
            path="$1"
            marker="$2"
            output="$3"
            check_shell_page "$path" "$marker" "$output"
            grep -Fq '<link rel="stylesheet" href="/assets/css/homepage.css">' "$output"
            test "$(grep -Fc '/assets/css/homepage.css' "$output")" = '1'
          }

          check_marketing_page '/' 'No exact destination means no public deal card.' homepage.html
          check_marketing_page '/deals/' 'No verified public deal cards are active.' deals.html
          check_marketing_page '/deals/walmart/' 'No verified Walmart deal cards are currently published.' walmart.html
          check_marketing_page '/deals/lowes/' 'No verified Lowe’s deal cards are active.' lowes.html
          check_marketing_page '/deals/best-buy/' 'No verified Best Buy deal cards are active.' bestbuy.html
          check_marketing_page '/deals/home-depot/' 'No verified Home Depot deal cards are active.' homedepot.html
          check_marketing_page '/deals/amazon/' 'No verified Amazon deal cards are active.' amazon.html
          check_marketing_page '/about/' 'Deal discovery with exact-offer discipline.' about.html
          check_marketing_page '/partners/' 'Exact deep links' partners.html
          check_marketing_page '/contact/' 'Reach SniperPlug directly.' contact.html
          check_shell_page '/privacy/' 'Sessions, cookies, and local storage' privacy.html
          check_shell_page '/affiliate-disclosure/' 'Editorial and verification independence' disclosure.html
          check_shell_page '/terms/' 'Authorized private tools' terms.html

          missing_code="$(curl --silent --show-error --max-time 25 --output missing.html --write-out '%{http_code}' "${pages}/definitely-not-a-real-sniperplug-route-${COMMIT_SHA}" || true)"
          test "$missing_code" = '404'
          grep -Fq 'That page slipped away.' missing.html
          grep -Fq 'class="site-header"' missing.html
          grep -Fq 'class="site-footer"' missing.html
          grep -Fq 'class="error-card"' missing.html

          test "$(grep -c '^@import' styles.css)" = '2'
          grep -Fq "@import url('/assets/css/site-base.css');" styles.css
          grep -Fq "@import url('/assets/css/site-shell.css');" styles.css
          grep -Fq -- '--brand:#68e384' site-base.css
          grep -Fq '.site-header{' site-base.css
          grep -Fq '.site-footer{' site-base.css
          grep -Fq '.brand-mark{' site-shell.css
          grep -Fq 'sniperplug-logo-exact.png' site-shell.css
          grep -Fq '.page-hero{position:relative' site-shell.css
          grep -Fq '.legal-card{max-width:980px' site-shell.css
          grep -Fq '.error-shell{' site-shell.css
          grep -Fq '@media(max-width:700px)' site-shell.css

          curl --silent --show-error --max-time 25 "${pages}/assets/css/homepage.css?production=${COMMIT_SHA}" > marketing-theme.css
          grep -Fq '.section-soft{' marketing-theme.css
          grep -Fq '.capability-grid{' marketing-theme.css
          grep -Fq '.capability-card{' marketing-theme.css
          grep -Fq '@media(max-width:700px)' marketing-theme.css
          ! grep -Fq 'sniperplug-logo-exact.png' marketing-theme.css

          grep -Fiq 'cache-control: public, max-age=0, must-revalidate' exact-logo.headers
          grep -Fq "document.querySelectorAll('.brand-mark')" site-runtime.js
          grep -Fq "logo.style.objectFit = 'contain'" site-runtime.js
          grep -Fq "logo.style.aspectRatio = '1 / 1'" site-runtime.js
          grep -Fq "mark.dataset.brandArtwork = 'owner-approved-exact'" site-runtime.js
          grep -Fq 'mark.replaceChildren(logo)' site-runtime.js

          python3 - <<'PY'
          import base64, hashlib, re, struct
          expected = '3df6e4d5fc89940a406c2a938c1e30d23e8e96ed54fc5328386d82e780a5fd86'
          runtime = open('site-runtime.js', encoding='utf-8').read()
          match = re.search(r"data:image/png;base64,([A-Za-z0-9+/='\",\s]+?)',\s*\]", runtime, re.S)
          if not match:
              raise SystemExit('exact PNG not found in site runtime')
          runtime_png = base64.b64decode(re.sub(r"['\",\s]", '', match.group(1)), validate=True)
          asset_png = open('exact-logo.png', 'rb').read()
          for label, image in [('runtime', runtime_png), ('asset', asset_png)]:
              if image[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{label} logo is not PNG')
              width, height = struct.unpack('>II', image[16:24])
              if (width, height) != (96, 96):
                  raise SystemExit(f'{label} logo is {width}x{height}, expected 96x96')
              digest = hashlib.sha256(image).hexdigest()
              if digest != expected:
                  raise SystemExit(f'{label} logo checksum changed: {digest}')
          if runtime_png != asset_png:
              raise SystemExit('runtime and static exact-logo bytes differ')
          PY

          retired_code="$(curl --silent --show-error --location --max-time 25 --output retired.html --write-out '%{http_code}' "${pages}/deal/walmart-shark-navigator-vacuum/?production=${COMMIT_SHA}" || true)"
          test "$retired_code" = '200'
          grep -Fq 'Only confirmed offers belong here.' retired.html
          ! grep -Eiq 'Shark Navigator|\$89\.00|Launch example|sample item' retired.html

          curl --silent --show-error --max-time 25 "${pages}/sitemap.xml?production=${COMMIT_SHA}" > sitemap.xml
          grep -Fq '<loc>https://sniperplug.com/deals/</loc>' sitemap.xml
          ! grep -Fq '<loc>https://sniperplug.com/deal/' sitemap.xml

          custom_code="$(curl --silent --show-error --location --max-time 25 \
            --user-agent 'Mozilla/5.0 (compatible; SniperPlug-Affiliate-Readiness/1.0)' \
            --output custom.html --write-out '%{http_code}' \
            "${custom}/deals/?production=${COMMIT_SHA}" || true)"
          ! grep -Eiq "$banned" custom.html 2>/dev/null
          if [ "$custom_code" = '200' ]; then
            grep -Fq 'No verified public deal cards are active.' custom.html
            grep -Fq '/assets/css/styles.css' custom.html
            grep -Fq '/assets/css/homepage.css' custom.html
            echo 'Custom domain served the unified affiliate-ready deal board.'
          elif [ "$custom_code" = '403' ]; then
            echo 'Custom domain applied a Cloudflare bot challenge; no retired public content was returned.'
          else
            echo "::error::Custom domain returned unexpected HTTP ${custom_code}."
            sed -n '1,140p' custom.html 2>/dev/null || true
            exit 1
          fi

          echo 'reason=Pages production passed affiliate content, full visual shell, exact owner-approved PNG, and custom-domain safety checks.' >> "$GITHUB_OUTPUT"

      - name: Publish production readiness status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Unified affiliate production passed'
          else
            state='failure'
            description='Affiliate visual production checks failed'
          fi
          payload="$(jq -nc \
            --arg state "$state" \
            --arg context 'ci/sniperplug-production-affiliate-readiness' \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null
