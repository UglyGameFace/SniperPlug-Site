name: Apply source filter pagination repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/control-center-mobile-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply filtered pagination repair
        run: python tools/patch-source-filter-pagination.py
      - name: Validate focused and full suite
        run: |
          node --check assets/js/control-center-v2.js
          node tools/audit-control-mobile-flow.mjs
          npm run build
      - name: Commit validated repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/control-center-v2.js tools/audit-control-mobile-flow.mjs
          git commit -m "Filter source results before mobile pagination"
          git push origin HEAD:fix/control-center-mobile-flow
