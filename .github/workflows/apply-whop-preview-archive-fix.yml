name: Apply exact Whop archive preview fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/whop-backup-reset-restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/whop-backup-reset-restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Share exact archive construction between preview and create
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('functions/_lib/whop-backups.js')
          service = service_path.read_text()

          preview_anchor = """export async function previewWhopReset(env, input = {}) {\n  const snapshot = await snapshotScope(env, input);\n  const estimatedBytes = byteLength(stableBackupJson(snapshot.entities));\n  if (estimatedBytes > MAX_BACKUP_BYTES) throw new HttpError(413, 'This source is larger than the 10 MB safe backup limit. Back up a smaller source before resetting.');\n  return {\n    scope: snapshot.scope.scope,\n    experienceId: snapshot.scope.experienceId,\n    label: backupLabel(snapshot.scope, snapshot.rows),\n    counts: snapshot.counts,\n    payloadBytes: estimatedBytes,\n"""
          helper_and_preview = """async function buildWhopBackupArchive(env, snapshot, ownerSessionId) {\n  const createdAt = nowIso();\n  const backupId = `wib_${randomToken(18)}`;\n  const ownerId = String(ownerSessionId || 'sniperplug-owner');\n  const digest = await sha256(`backup:${backupId}:${snapshot.entityChecksum}`);\n  const archiveKey = `whop-${digest.slice(0, 32)}-whop-import-backup.json`;\n  const manifest = manifestFor(backupId, ownerId, snapshot, createdAt, archiveKey);\n  const unsigned = {\n    backup_id: backupId,\n    owner_session_id: ownerId,\n    checksum: snapshot.entityChecksum,\n    archive_key: archiveKey,\n    created_at: createdAt,\n    scope: snapshot.scope.scope,\n    experience_id: snapshot.scope.experienceId,\n    schema_version: WHOP_BACKUP_SCHEMA_VERSION,\n  };\n  const signature = await signValue(backupSignatureValue(unsigned), env?.SNIPERPLUG_SESSION_SECRET);\n  const archiveJson = stableBackupJson({ manifest, signature, entities: snapshot.entities });\n  const archiveBytes = byteLength(archiveJson);\n  if (archiveBytes > MAX_BACKUP_BYTES) throw new HttpError(413, 'This source is larger than the 10 MB safe backup limit. Back up a smaller source before resetting.');\n  return {\n    createdAt,\n    backupId,\n    ownerId,\n    archiveKey,\n    manifest,\n    signature,\n    archiveJson,\n    archiveBytes,\n    archiveChecksum: await sha256(archiveJson),\n  };\n}\n\nexport async function previewWhopReset(env, ownerSessionId, input = {}) {\n  const snapshot = await snapshotScope(env, input);\n  const archive = await buildWhopBackupArchive(env, snapshot, ownerSessionId);\n  return {\n    scope: snapshot.scope.scope,\n    experienceId: snapshot.scope.experienceId,\n    label: backupLabel(snapshot.scope, snapshot.rows),\n    counts: snapshot.counts,\n    payloadBytes: archive.archiveBytes,\n"""
          if helper_and_preview not in service:
              if preview_anchor not in service:
                  raise SystemExit('preview archive anchor missing')
              service = service.replace(preview_anchor, helper_and_preview, 1)

          create_anchor = """  const snapshot = await snapshotScope(env, input);\n  const db = await ensureWhopBackupSchema(env);\n  const createdAt = nowIso();\n  const backupId = `wib_${randomToken(18)}`;\n  const ownerId = String(ownerSessionId || 'sniperplug-owner');\n  const digest = await sha256(`backup:${backupId}:${snapshot.entityChecksum}`);\n  const archiveKey = `whop-${digest.slice(0, 32)}-whop-import-backup.json`;\n  const manifest = manifestFor(backupId, ownerId, snapshot, createdAt, archiveKey);\n  const unsigned = {\n    backup_id: backupId,\n    owner_session_id: ownerId,\n    checksum: snapshot.entityChecksum,\n    archive_key: archiveKey,\n    created_at: createdAt,\n    scope: snapshot.scope.scope,\n    experience_id: snapshot.scope.experienceId,\n    schema_version: WHOP_BACKUP_SCHEMA_VERSION,\n  };\n  const signature = await signValue(backupSignatureValue(unsigned), env?.SNIPERPLUG_SESSION_SECRET);\n  const archiveJson = stableBackupJson({ manifest, signature, entities: snapshot.entities });\n  const archiveBytes = byteLength(archiveJson);\n  if (archiveBytes > MAX_BACKUP_BYTES) throw new HttpError(413, 'This source is larger than the 10 MB safe backup limit. Back up a smaller source before resetting.');\n  const archiveChecksum = await sha256(archiveJson);\n"""
          create_replacement = """  const snapshot = await snapshotScope(env, input);\n  const db = await ensureWhopBackupSchema(env);\n  const archive = await buildWhopBackupArchive(env, snapshot, ownerSessionId);\n  const {\n    createdAt, backupId, ownerId, archiveKey, manifest, signature,\n    archiveJson, archiveBytes, archiveChecksum,\n  } = archive;\n"""
          if create_replacement not in service:
              if create_anchor not in service:
                  raise SystemExit('create archive anchor missing')
              service = service.replace(create_anchor, create_replacement, 1)
          service_path.write_text(service)

          endpoint_path = Path('functions/api/whop-backups.js')
          endpoint = endpoint_path.read_text()
          old_preview = "if (currentAction === 'preview') return json(await previewWhopReset(env, body));"
          new_preview = "if (currentAction === 'preview') return json(await previewWhopReset(env, admin.sid, body));"
          if new_preview not in endpoint:
              if old_preview not in endpoint:
                  raise SystemExit('preview endpoint anchor missing')
              endpoint = endpoint.replace(old_preview, new_preview, 1)
          endpoint_path.write_text(endpoint)

          audit_path = Path('tools/audit-whop-backups.mjs')
          audit = audit_path.read_text()
          anchor = "assert.ok(service.includes('new Blob([archiveJson]') && service.includes('archive_checksum'));\n"
          additions = anchor + """assert.ok(service.includes('async function buildWhopBackupArchive') && service.includes('payloadBytes: archive.archiveBytes'), 'Preview and create do not share exact archive sizing.');\nassert.ok(service.includes('const archive = await buildWhopBackupArchive(env, snapshot, ownerSessionId)'));\nassert.ok(!service.includes('const estimatedBytes = byteLength(stableBackupJson(snapshot.entities))'));\nassert.ok(endpoint.includes("previewWhopReset(env, admin.sid, body)"), 'Preview archive sizing is not bound to the same owner identity as creation.');\n"""
          if 'Preview and create do not share exact archive sizing' not in audit:
              if anchor not in audit:
                  raise SystemExit('preview audit anchor missing')
              audit = audit.replace(anchor, additions, 1)
          audit_path.write_text(audit)
          PY
      - name: Validate exact preview archive path
        run: |
          node --check functions/_lib/whop-backups.js
          node --check functions/api/whop-backups.js
          node tools/audit-whop-backups.mjs
          npm run build
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_lib/whop-backups.js functions/api/whop-backups.js tools/audit-whop-backups.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use exact archive size in Whop reset preview"
          git push
