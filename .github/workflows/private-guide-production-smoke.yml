name: Verify production guide privacy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-guide-privacy
  cancel-in-progress: true

jobs:
  anonymous-guide-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Cloudflare and verify private routes
        id: probe
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          private_markers='HIDDEN FILES SELLER ERRORS|Seller Errors allow you|Sports Betting|Auto Checkout|Bots & Automation'

          request_page() {
            local base_url="$1"
            local label="$2"
            local allow_challenge="$3"
            local attempt nonce status
            for attempt in $(seq 1 36); do
              nonce="${COMMIT_SHA}-${label}-${attempt}-$(date +%s)"
              rm -f "${label}-headers.txt" "${label}-body.txt"
              status="$(curl --silent --show-error --location \
                --max-time 25 \
                --user-agent 'Mozilla/5.0 (compatible; SniperPlug-Privacy-Audit/1.0)' \
                --header 'Accept: text/html,application/xhtml+xml' \
                --dump-header "${label}-headers.txt" \
                --output "${label}-body.txt" \
                --write-out '%{http_code}' \
                "${base_url}/guides/?privacy_audit=${nonce}" || true)"

              if grep -Eiq "$private_markers" "${label}-body.txt" 2>/dev/null; then
                echo "${label} attempt ${attempt}: private guide text is still readable with HTTP ${status}."
                sleep 20
                continue
              fi

              if [ "$status" = '401' ] && grep -Eiq 'Unlock the private guides|Owner-only library' "${label}-body.txt"; then
                echo "${label}: anonymous request received the owner lock page."
                return 0
              fi

              if [ "$allow_challenge" = 'yes' ] && [ "$status" = '403' ]; then
                echo "${label}: anonymous request was blocked by Cloudflare before private content could be read."
                return 0
              fi

              echo "${label} attempt ${attempt}: HTTP ${status}; private lock not confirmed yet."
              sleep 20
            done

            echo "::error::${label} did not return the owner lock before timeout."
            echo "--- ${label} response headers ---"
            cat "${label}-headers.txt" 2>/dev/null || true
            echo "--- ${label} response body (first 120 lines) ---"
            sed -n '1,120p' "${label}-body.txt" 2>/dev/null || true
            return 1
          }

          # The pages.dev hostname is outside the custom-zone bot challenge and
          # must prove the deployed Pages Function itself returns the owner lock.
          request_page 'https://sniperplug.pages.dev' 'pages' 'no'

          # The real custom domain may receive a Super Bot Fight challenge. Both
          # the owner lock and a Cloudflare 403 are safe, but private text is not.
          request_page 'https://sniperplug.com' 'custom' 'yes'

          echo 'reason=Pages returned the owner lock and the custom domain blocked anonymous guide access.' >> "$GITHUB_OUTPUT"

      - name: Publish production privacy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Pages and custom-domain guide privacy passed'
          else
            state='failure'
            description='Production may expose private guide content'
          fi
          payload="$(jq -nc \
            --arg state "$state" \
            --arg context 'ci/sniperplug-production-guide-privacy' \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null
