name: Apply Whop backup reset hardening

on:
  push:
    branches:
      - feat/whop-backup-reset-restore

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final safety hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          backup_path = Path('functions/_lib/whop-backups.js')
          backup = backup_path.read_text()
          backup = backup.replace('const MAX_BACKUP_BYTES = 80_000_000;', 'const MAX_BACKUP_BYTES = 30_000_000;')
          backup = backup.replace('This importer backup is larger than 80 MB.', 'This importer backup is larger than 30 MB.')
          old_signature = "return [row.backup_id, row.checksum, row.created_at, row.scope, row.experience_id || '', row.schema_version].join('.');"
          new_signature = "return [row.backup_id, row.owner_session_id || '', row.checksum, row.created_at, row.scope, row.experience_id || '', row.schema_version].join('.');"
          if new_signature not in backup:
              if old_signature not in backup: raise SystemExit('backup signature anchor missing')
              backup = backup.replace(old_signature, new_signature, 1)
          unsigned_anchor = """  const unsigned = {\n    backup_id: backupId,\n    checksum: snapshot.checksum,\n"""
          unsigned_replacement = """  const unsigned = {\n    backup_id: backupId,\n    owner_session_id: String(ownerSessionId || 'sniperplug-owner'),\n    checksum: snapshot.checksum,\n"""
          if unsigned_replacement not in backup:
              if unsigned_anchor not in backup: raise SystemExit('unsigned owner anchor missing')
              backup = backup.replace(unsigned_anchor, unsigned_replacement, 1)
          verify_anchor = """    await verifyBackup(env, backupId, { includePayload: false, allowCreating: true });\n    const verifiedUpdate = await db.prepare(`UPDATE whop_import_backups SET status = 'verified', verified_at = ? WHERE backup_id = ? AND status = 'creating'`)\n"""
          verify_replacement = """    await verifyBackup(env, backupId, { includePayload: false, allowCreating: true });\n    const stableScope = await snapshotScope(env, snapshot.scope);\n    if (stableScope.contentChecksum !== snapshot.contentChecksum) {\n      throw new HttpError(409, 'The importer changed while SniperPlug was creating this backup. The incomplete snapshot was not verified; create it again.', {\n        code: 'backup_scope_changed_during_create',\n        backupId,\n      });\n    }\n    const verifiedUpdate = await db.prepare(`UPDATE whop_import_backups SET status = 'verified', verified_at = ? WHERE backup_id = ? AND status = 'creating'`)\n"""
          if verify_replacement not in backup:
              if verify_anchor not in backup: raise SystemExit('backup stable-scope anchor missing')
              backup = backup.replace(verify_anchor, verify_replacement, 1)
          context_anchor = """export async function authorizeWhopReset(env, backupId, options = {}) {\n"""
          context_block = """export async function verifiedWhopResetContext(env, backupId) {\n  const verified = await verifyBackup(env, backupId, { includePayload: false });\n  const options = safeJson(verified.row.reset_options_json, {}) || {};\n  return {\n    backupId: verified.row.backup_id,\n    scope: verified.row.scope,\n    experienceId: verified.row.experience_id || null,\n    options: {\n      deletePublished: options.deletePublished === true,\n      resync: options.resync === true,\n      disconnectWhop: options.disconnectWhop === true,\n    },\n    confirmationPhrase: resetConfirmationPhrase({\n      scope: verified.row.scope,\n      experienceId: verified.row.experience_id,\n    }, options.deletePublished === true),\n  };\n}\n\n"""
          if 'export async function verifiedWhopResetContext' not in backup:
              if context_anchor not in backup: raise SystemExit('reset context anchor missing')
              backup = backup.replace(context_anchor, context_block + context_anchor, 1)
          backup_path.write_text(backup)

          endpoint_path = Path('functions/api/whop-backups.js')
          endpoint = endpoint_path.read_text()
          import_anchor = """  restoreWhopImportBackup,\n} from '../_lib/whop-backups.js';\n"""
          import_replacement = """  restoreWhopImportBackup,\n  verifiedWhopResetContext,\n} from '../_lib/whop-backups.js';\n"""
          if import_replacement not in endpoint:
              if import_anchor not in endpoint: raise SystemExit('endpoint reset-context import anchor missing')
              endpoint = endpoint.replace(import_anchor, import_replacement, 1)
          endpoint = endpoint.replace('return new Response(JSON.stringify(payload, null, 2), {', 'return new Response(JSON.stringify(payload), {')
          old_restore = """  if (currentAction === 'restore') {\n    return json(await restoreWhopImportBackup(env, backupId(request, body), body));\n  }\n"""
          new_restore = """  if (currentAction === 'restore') {\n    const id = backupId(request, body);\n    try {\n      return json(await restoreWhopImportBackup(env, id, body));\n    } catch (error) {\n      if (error instanceof HttpError && [400, 401, 403, 404, 422].includes(error.status)) throw error;\n      throw new HttpError(409, 'The restore did not finish. Any rows already restored are preserved, the verified backup is unchanged, and retrying the same restore is safe.', {\n        code: 'backup_restore_retry_safe',\n        backupId: id,\n        cause: String(error?.message || 'Unknown restore interruption.').slice(0, 300),\n      });\n    }\n  }\n"""
          if new_restore not in endpoint:
              if old_restore not in endpoint: raise SystemExit('endpoint restore anchor missing')
              endpoint = endpoint.replace(old_restore, new_restore, 1)
          old_reset = """  if (currentAction === 'reset') {\n    let whop = null;\n    if (body.resync === true) whop = await requireWhopSession(request, env, admin);\n    const result = await resetWhopImporter(env, backupId(request, body), body);\n    let resync = null;\n    if (result.options.resync === true) {\n      if (result.scope !== 'source' || !result.experienceId) {\n        throw new HttpError(422, 'Automatic resync is available only when clearing one exact Whop source.');\n      }\n      if (!whop) whop = await requireWhopSession(request, env, admin);\n      const experience = await retrieveExperience(whop, result.experienceId);\n      await saveSourceDecision(env, experience, result.experienceId, 'approved');\n      const posts = await scanApprovedSource(env, whop, experience);\n      resync = {\n        experienceId: result.experienceId,\n        title: String(experience?.name || experience?.company?.title || result.experienceId),\n        posts: posts.length,\n        approved: posts.filter((post) => post.decision === 'approved').length,\n        pending: posts.filter((post) => post.decision === 'pending').length,\n        blocked: posts.filter((post) => post.decision === 'blocked').length,\n      };\n    }\n"""
          new_reset = """  if (currentAction === 'reset') {\n    const id = backupId(request, body);\n    const resetContext = await verifiedWhopResetContext(env, id);\n    let whop = null;\n    let experience = null;\n    if (resetContext.options.resync === true) {\n      if (resetContext.scope !== 'source' || !resetContext.experienceId) {\n        throw new HttpError(422, 'Automatic resync is available only when clearing one exact Whop source.');\n      }\n      whop = await requireWhopSession(request, env, admin);\n      experience = await retrieveExperience(whop, resetContext.experienceId);\n    }\n    const result = await resetWhopImporter(env, id, body);\n    let resync = null;\n    if (result.options.resync === true) {\n      await saveSourceDecision(env, experience, result.experienceId, 'approved');\n      const posts = await scanApprovedSource(env, whop, experience);\n      resync = {\n        experienceId: result.experienceId,\n        title: String(experience?.name || experience?.company?.title || result.experienceId),\n        posts: posts.length,\n        approved: posts.filter((post) => post.decision === 'approved').length,\n        pending: posts.filter((post) => post.decision === 'pending').length,\n        blocked: posts.filter((post) => post.decision === 'blocked').length,\n      };\n    }\n"""
          if new_reset not in endpoint:
              if old_reset not in endpoint: raise SystemExit('endpoint preflight-resync anchor missing')
              endpoint = endpoint.replace(old_reset, new_reset, 1)
          endpoint_path.write_text(endpoint)

          client_path = Path('assets/js/control-center-whop-backups.js')
          client = client_path.read_text()
          old_actions = """        <div class=\"button-row\">\n          <a class=\"btn ghost\" href=\"${escapeHtml(backup.downloadUrl)}\" data-backup-download>Download JSON</a>\n          <button class=\"btn ghost\" type=\"button\" data-backup-restore=\"${escapeHtml(backup.backupId)}\">Restore</button>\n          <button class=\"decision disapprove\" type=\"button\" data-backup-delete=\"${escapeHtml(backup.backupId)}\">Delete backup</button>\n        </div>\n"""
          new_actions = """        ${backup.status === 'verified' ? `\n          <div class=\"button-row\">\n            <a class=\"btn ghost\" href=\"${escapeHtml(backup.downloadUrl)}\" data-backup-download>Download JSON</a>\n            <button class=\"btn ghost\" type=\"button\" data-backup-restore=\"${escapeHtml(backup.backupId)}\">Restore</button>\n            <button class=\"decision disapprove\" type=\"button\" data-backup-delete=\"${escapeHtml(backup.backupId)}\">Delete backup</button>\n          </div>` : '<small>This incomplete backup cannot be downloaded, restored, or used for reset.</small>'}\n"""
          if new_actions not in client:
              if old_actions not in client: raise SystemExit('client verified-actions anchor missing')
              client = client.replace(old_actions, new_actions, 1)
          old_count = "if (!quiet) show(`Backup history ready. ${state.overview.backups.length} verified backup(s) available.`, 'ok');"
          new_count = "if (!quiet) show(`Backup history ready. ${state.overview.backups.filter((backup) => backup.status === 'verified').length} verified backup(s) available.`, 'ok');"
          if new_count not in client:
              if old_count not in client: raise SystemExit('client verified-count anchor missing')
              client = client.replace(old_count, new_count, 1)
          client_path.write_text(client)

          audit_path = Path('tools/audit-whop-backups.mjs')
          audit = audit_path.read_text()
          anchor = """assert.ok(service.includes('current.contentChecksum !== verified.manifest.contentChecksum'), 'Reset can delete work added after the backup.');\n"""
          additions = anchor + """assert.ok(service.includes('stableScope.contentChecksum !== snapshot.contentChecksum') && service.includes("backup_scope_changed_during_create"), 'A backup can become verified after its source changes during snapshot creation.');\nassert.ok(service.includes("row.owner_session_id || ''") && service.includes('owner_session_id: String(ownerSessionId'), 'Backup signatures are not bound to the owner session.');\nassert.ok(service.includes('const MAX_BACKUP_BYTES = 30_000_000'), 'Backup exports can exceed a safe in-memory Workers payload.');\nassert.ok(service.includes('export async function verifiedWhopResetContext'), 'The reset endpoint cannot preflight stored resync options before deletion.');\n"""
          if 'backup_scope_changed_during_create' not in audit:
              if anchor not in audit: raise SystemExit('audit backup-hardening anchor missing')
              audit = audit.replace(anchor, additions, 1)
          endpoint_anchor = """assert.ok(endpoint.includes(\"currentAction === 'restore'\") && endpoint.includes('restoreWhopImportBackup'), 'Offline restore endpoint is missing.');\n"""
          endpoint_add = endpoint_anchor + """assert.ok(endpoint.indexOf('verifiedWhopResetContext(env, id)') < endpoint.indexOf('resetWhopImporter(env, id, body)'), 'Reset does not preflight its stored resync scope before deletion.');\nassert.ok(endpoint.indexOf('retrieveExperience(whop, resetContext.experienceId)') < endpoint.indexOf('resetWhopImporter(env, id, body)'), 'The exact resync source is not proven readable before deletion.');\nassert.ok(endpoint.includes("code: 'backup_restore_retry_safe'"), 'Interrupted restore does not explain that the verified backup is safe to retry.');\nassert.ok(endpoint.includes('JSON.stringify(payload)') && !endpoint.includes('JSON.stringify(payload, null, 2)'), 'Backup download wastes Workers memory on pretty-printed JSON.');\n"""
          if 'verifiedWhopResetContext(env, id)' not in audit:
              if endpoint_anchor not in audit: raise SystemExit('audit endpoint-hardening anchor missing')
              audit = audit.replace(endpoint_anchor, endpoint_add, 1)
          client_anchor = """assert.ok(client.includes('Download JSON') && client.includes('Restore verified backup'), 'Backup history lacks download or restore actions.');\n"""
          client_add = client_anchor + """assert.ok(client.includes("backup.status === 'verified'") && client.includes('incomplete backup cannot be downloaded'), 'Failed backups still expose destructive or recovery actions.');\n"""
          if 'incomplete backup cannot be downloaded' not in audit:
              if client_anchor not in audit: raise SystemExit('audit client-hardening anchor missing')
              audit = audit.replace(client_anchor, client_add, 1)
          audit_path.write_text(audit)

          task_path = Path('ACTIVE_TASK.md')
          task = task_path.read_text()
          marker = '- Current-state checksum comparison immediately before deletion so newer work forces a fresh backup.\n'
          extra = ('- Re-check the scope after snapshot persistence so concurrent changes prevent the backup from becoming verified.\n'
                   '- Resolve and authorize the exact Whop source before any clear-and-resync deletion begins.\n'
                   '- Bind backup signatures to the owner session, keep incomplete backups actionless, cap in-memory exports at 30 MB, and make interrupted restore explicitly retry-safe.\n')
          if 'Re-check the scope after snapshot persistence' not in task:
              if marker not in task: raise SystemExit('active-task hardening anchor missing')
              task = task.replace(marker, marker + extra, 1)
          task_path.write_text(task)
          PY
      - name: Run focused backup regression
        run: |
          node --check functions/_lib/whop-backups.js
          node --check functions/api/whop-backups.js
          node --check assets/js/control-center-whop-backups.js
          node tools/audit-whop-backups.mjs
      - name: Run full Node 22 build
        run: npm run build
      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACTIVE_TASK.md functions/_lib/whop-backups.js functions/api/whop-backups.js assets/js/control-center-whop-backups.js tools/audit-whop-backups.mjs
          if git diff --cached --quiet; then
            echo "No hardening changes required"
            exit 0
          fi
          git commit -m "Harden verified Whop reset and offline restore"
          git push
