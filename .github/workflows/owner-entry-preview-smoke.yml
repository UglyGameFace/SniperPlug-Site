name: Owner entry preview smoke

on:
  pull_request:
  push:
    branches: [fix/private-guides-owner-auth]

permissions:
  contents: read

concurrency:
  group: owner-entry-preview-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed owner entry and private guide lock
        env:
          PREVIEW_URL: https://fix-private-guides-owner-aut.sniperplug.pages.dev
        run: |
          set -euo pipefail
          homepage=''
          for attempt in $(seq 1 40); do
            homepage="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "${PREVIEW_URL}/?owner-entry-smoke=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq 'href="/control-center/"' <<<"$homepage" && grep -Fq '>Owner access</a>' <<<"$homepage"; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo 'The branch preview never exposed the new Owner access entry.' >&2
              exit 1
            fi
            sleep 10
          done

          grep -Fq 'href="/control-center/"' <<<"$homepage"
          grep -Fq '>Owner access</a>' <<<"$homepage"
          if grep -Fq 'href="/guides/"' <<<"$homepage"; then
            echo 'The public homepage still exposes a direct private Guides link.' >&2
            exit 1
          fi

          control_center="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "${PREVIEW_URL}/control-center/?owner-entry-smoke=${GITHUB_SHA}")"
          grep -Fq 'Private guides' <<<"$control_center"
          grep -Fq 'Unlock the Guide Control Center.' <<<"$control_center"

          # The protected route deliberately returns 401/403 with a usable HTML lock page.
          guide_lock="$(curl --silent --show-error --location --header 'Cache-Control: no-cache' "${PREVIEW_URL}/guides/?owner-entry-smoke=${GITHUB_SHA}")"
          grep -Fq 'same password you already use for the SniperPlug Control Center' <<<"$guide_lock"
          grep -Fq 'Unlock private guides' <<<"$guide_lock"

          sitemap="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "${PREVIEW_URL}/sitemap.xml?owner-entry-smoke=${GITHUB_SHA}")"
          if grep -Fq '/guides/' <<<"$sitemap"; then
            echo 'Private guide URLs remain in the public sitemap.' >&2
            exit 1
          fi
