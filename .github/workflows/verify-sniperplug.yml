name: Verify SniperPlug

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/whop-guide-importer]

permissions:
  contents: read

concurrency:
  group: verify-sniperplug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run full build and regression suite
        run: npm run build
