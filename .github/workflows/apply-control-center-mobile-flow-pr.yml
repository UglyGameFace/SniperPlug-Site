name: Apply Control Center mobile flow from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/control-center-mobile-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic repair
        run: |
          if ! grep -q "const POST_PAGE_SIZE = 10" assets/js/control-center-v2.js; then
            python tools/apply-control-center-mobile-flow.py
            python tools/patch-control-mobile-audits.py
          fi
          python tools/patch-control-center-mobile-followup.py
      - name: Validate focused and full suite
        run: |
          node --check assets/js/control-center-v2.js
          node --check assets/js/control-center-whop-backups.js
          node tools/audit-control-mobile-flow.mjs
          npm run build
      - name: Commit validated repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/control-center-v2.js assets/js/control-center-whop-backups.js assets/css/control-center-hardening.css tools/audit-control-mobile-flow.mjs tools/audit-control-performance-media.mjs package.json
          git commit -m "Finish lazy mobile Control Center flow"
          git push origin HEAD:fix/control-center-mobile-flow
