name: Verify retired public deal routes

on:
  pull_request:
    paths:
      - 'data/deals.json'
      - 'deal/**'
      - 'deals/**'
      - 'functions/_middleware.js'
      - 'functions/deal/**'
      - 'functions/go/**'
      - '_headers'
      - '_redirects'
      - 'tools/audit-affiliate-readiness.mjs'
      - 'tools/test-retired-public-deals.mjs'
      - 'package.json'
      - '.github/workflows/retired-public-deal-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'data/deals.json'
      - 'deal/**'
      - 'deals/**'
      - 'functions/_middleware.js'
      - 'functions/deal/**'
      - 'functions/go/**'
      - '_headers'
      - '_redirects'
      - 'tools/audit-affiliate-readiness.mjs'
      - 'tools/test-retired-public-deals.mjs'
      - 'package.json'
      - '.github/workflows/retired-public-deal-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: retired-public-deals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retired-route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve Cloudflare deployment
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            alias="$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-|-$//g')"
            alias="${alias:0:28}"
            base="https://${alias}.sniperplug.pages.dev"
          else
            base='https://sniperplug.pages.dev'
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify fail-closed deal and click-out routes
        env:
          BASE: ${{ steps.target.outputs.base }}
          COMMIT_SHA: ${{ steps.target.outputs.commit }}
        run: |
          set -uo pipefail
          banned='Shark Navigator|Blackstone 36|Samsung Odyssey|DEWALT drill kit|Ninja air fryer|Launch example|sample item|walmart\.com/(search|search-results)|bestbuy\.com/site/searchpage|amazon\.com/(s\?|s/)|lowes\.com/search|homedepot\.com/s/'

          ready=0
          for attempt in $(seq 1 36); do
            nonce="${COMMIT_SHA}-${attempt}-$(date +%s)"
            board_code="$(curl --silent --show-error --max-time 25 --output board.html --write-out '%{http_code}' "${BASE}/deals/?retiredSmoke=${nonce}" || true)"
            deal_code="$(curl --silent --show-error --max-time 25 --dump-header deal.headers --output deal.body --write-out '%{http_code}' "${BASE}/deal/walmart-shark-navigator-vacuum/?retiredSmoke=${nonce}" || true)"
            go_code="$(curl --silent --show-error --max-time 25 --dump-header go.headers --output go.body --write-out '%{http_code}' "${BASE}/go/walmart-shark-navigator-vacuum/?retiredSmoke=${nonce}" || true)"
            echo "Attempt ${attempt}: board=${board_code} deal=${deal_code} go=${go_code}"

            if [ "$board_code" = '200' ] \
              && [ "$deal_code" = '308' ] \
              && [ "$go_code" = '308' ] \
              && grep -Fq 'No verified public deal cards are active.' board.html \
              && grep -Eiq '^location: .*\/deals\/\?notice=retired-deal' deal.headers \
              && grep -Eiq '^location: .*\/deals\/\?notice=retired-link' go.headers; then
              ready=1
              break
            fi
            sleep 20
          done

          if [ "$ready" -ne 1 ]; then
            echo '::error::Cloudflare never served the fail-closed retired-route deployment.'
            sed -n '1,80p' deal.headers 2>/dev/null || true
            sed -n '1,80p' go.headers 2>/dev/null || true
            sed -n '1,120p' board.html 2>/dev/null || true
            exit 1
          fi

          set -e
          test ! -s deal.body
          test ! -s go.body

          deal_final_code="$(curl --silent --show-error --location --max-time 25 --output deal-final.html --write-out '%{http_code}' "${BASE}/deal/walmart-shark-navigator-vacuum/?retiredSmoke=${COMMIT_SHA}")"
          go_final_code="$(curl --silent --show-error --location --max-time 25 --output go-final.html --write-out '%{http_code}' "${BASE}/go/walmart-shark-navigator-vacuum/?retiredSmoke=${COMMIT_SHA}")"
          test "$deal_final_code" = '200'
          test "$go_final_code" = '200'
          grep -Fq 'No verified public deal cards are active.' deal-final.html
          grep -Fq 'No verified public deal cards are active.' go-final.html
          ! grep -Eiq "$banned" board.html deal-final.html go-final.html
          ! grep -Fqi 'deal-card' board.html deal-final.html go-final.html

          echo 'Retired deal and click-out routes fail closed to the verified empty board.'

      - name: Check custom domain safety
        if: github.event_name != 'pull_request'
        env:
          COMMIT_SHA: ${{ steps.target.outputs.commit }}
        run: |
          set -euo pipefail
          banned='Shark Navigator|Blackstone 36|Samsung Odyssey|DEWALT drill kit|Ninja air fryer|Launch example|sample item|walmart\.com/(search|search-results)|bestbuy\.com/site/searchpage|amazon\.com/(s\?|s/)|lowes\.com/search|homedepot\.com/s/'
          code="$(curl --silent --show-error --location --compressed --max-time 30 \
            --user-agent 'Mozilla/5.0 (Linux; Android 15; SM-X710) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/28.0 Chrome/130.0.0.0 Safari/537.36' \
            --header 'accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            --header 'accept-language: en-US,en;q=0.9' \
            --output custom-retired.html --write-out '%{http_code}' \
            "https://sniperplug.com/deal/walmart-shark-navigator-vacuum/?retiredSmoke=${COMMIT_SHA}" || true)"

          if [ "$code" = '200' ]; then
            grep -Fq 'No verified public deal cards are active.' custom-retired.html
            ! grep -Eiq "$banned" custom-retired.html
            echo 'Custom domain served the safe verified board after the retired URL.'
          elif [ "$code" = '403' ]; then
            ! grep -Eiq "$banned" custom-retired.html
            echo 'Custom domain challenged the automation and exposed no deal content.'
          else
            echo "::error::Custom retired URL returned unexpected HTTP ${code}."
            sed -n '1,120p' custom-retired.html 2>/dev/null || true
            exit 1
          fi

      - name: Publish retired-deal production status
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Retired deal routes fail closed'
          else
            state='failure'
            description='Retired deal route safety failed'
          fi
          payload="$(jq -nc \
            --arg state "$state" \
            --arg context 'ci/sniperplug-production-retired-deals' \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null
