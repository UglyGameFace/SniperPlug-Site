name: Apply undo reimport and touch fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-undo-reimport-touch-fix
  cancel-in-progress: false

jobs:
  build:
    if: github.head_ref == 'agent/whop-guide-importer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/whop-guide-importer
          fetch-depth: 0
      - name: Apply exact implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new))

          replace('functions/_lib/guides-import.js',
          "    if (existing?.source_fingerprint === sourceFingerprint) {\n",
          "    if (existing?.source_fingerprint === sourceFingerprint && existing.status !== 'rejected') {\n")

          recent = Path('functions/_lib/recent-actions.js')
          text = recent.read_text()
          old = "  const references = [];\n  for (const job of jobs) {\n"
          new = "  const references = [];\n  for (const job of jobs) {\n"
          if text.count(old) != 1:
              raise SystemExit('recent actions reference marker missing')
          text = text.replace(old, new)
          marker = "  const unique = new Map(references.map((item) => [item.actionId, item]));\n"
          addition = "  const cutoff = new Date(Date.now() - HISTORY_HOURS * 3_600_000).toISOString();\n  const rejected = await db.prepare(`\n    SELECT id, source_key, source_group, updated_at\n    FROM guides\n    WHERE status = 'rejected' AND source_key IS NOT NULL AND updated_at >= ?\n    ORDER BY updated_at DESC\n    LIMIT ?\n  `).bind(cutoff, MAX_ACTIONS).all();\n  for (const guide of rejected.results || []) {\n    references.push({\n      actionId: `manual-reject:${guide.id}`,\n      jobId: null,\n      jobStatus: 'manual',\n      jobCreatedAt: guide.updated_at,\n      sourceId: null,\n      sourceTitle: guide.source_group || 'Imported Whop source',\n      guideId: Number(guide.id),\n    });\n  }\n  const unique = new Map(references.map((item) => [item.actionId, item]));\n"
          if text.count(marker) != 1:
              raise SystemExit('recent actions unique marker missing')
          text = text.replace(marker, addition)
          text = text.replace("      reversible: guide.status === 'published',", "      reversible: ['published', 'rejected'].includes(guide.status),")
          old_update = "      UPDATE guides\n      SET status = 'draft', published_at = NULL, updated_at = ?, integrity_json = ?\n      WHERE id = ? AND status = 'published'\n    `).bind(now, JSON.stringify({ ...integrity, undone: true, undoneAt: now, undoReason: 'Owner reversed a recent bulk-publish action.' }), item.guideId));"
          new_update = "      UPDATE guides\n      SET status = 'draft', published_at = NULL, updated_at = ?, integrity_json = ?\n      WHERE id = ? AND status IN ('published', 'rejected')\n    `).bind(now, JSON.stringify({ ...integrity, undone: true, undoneAt: now, undoReason: item.status === 'rejected' ? 'Owner restored a rejected imported guide.' : 'Owner reversed a recent bulk-publish action.' }), item.guideId));"
          if text.count(old_update) != 1:
              raise SystemExit('recent actions update marker missing')
          text = text.replace(old_update, new_update)
          text = text.replace("if (!selected.length) throw new HttpError(422, all ? 'No published bulk actions from the last 48 hours remain to undo.' : 'Select at least one published action to undo.');", "if (!selected.length) throw new HttpError(422, all ? 'No published or rejected imported actions from the last 48 hours remain to undo.' : 'Select at least one published or rejected action to undo.');")
          recent.write_text(text)

          runtime = Path('assets/js/control-center-v2.js')
          text = runtime.read_text()
          text = text.replace("    activeOperations: 0,\n", "    activeOperations: 0,\n    activeOperationKeys: new Set(),\n")
          old = "  async function withButton(button, label, work) {\n    if (button instanceof HTMLButtonElement && button.getAttribute('aria-busy') === 'true') return;\n    setWorking(button, true, label);\n    setOperationWorking(true, label);\n    try {\n      return await work();\n    } finally {\n      setWorking(button, false);\n      setOperationWorking(false);\n      syncButtons();\n    }\n  }\n"
          new = "  function operationKey(button, label) {\n    if (!(button instanceof HTMLElement)) return String(label || 'operation');\n    return [button.dataset.action, button.dataset.guideId, button.dataset.experienceId, button.getAttribute('data-logout') !== null ? 'logout' : '', label].filter(Boolean).join(':') || 'operation';\n  }\n\n  async function withButton(button, label, work) {\n    const key = operationKey(button, label);\n    if (state.activeOperationKeys.has(key) || (button instanceof HTMLButtonElement && button.getAttribute('aria-busy') === 'true')) return;\n    state.activeOperationKeys.add(key);\n    setWorking(button, true, label);\n    setOperationWorking(true, label);\n    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));\n    try {\n      return await work();\n    } finally {\n      state.activeOperationKeys.delete(key);\n      setWorking(button, false);\n      setOperationWorking(false);\n      syncButtons();\n    }\n  }\n"
          if text.count(old) != 1:
              raise SystemExit('withButton marker missing')
          text = text.replace(old, new)
          old_pointer = "  root.addEventListener('pointerdown', (event) => {\n    const target = event.target instanceof Element ? event.target.closest('button,.btn,[data-action]') : null;\n    if (!target || target.hasAttribute('disabled')) return;\n    target.dataset.pressed = 'true';\n    requestAnimationFrame(() => requestAnimationFrame(() => { delete target.dataset.pressed; }));\n  }, { passive: true });\n"
          new_pointer = "  root.addEventListener('pointerdown', (event) => {\n    const target = event.target instanceof Element ? event.target.closest('button,.btn,[data-action]') : null;\n    if (!target || target.hasAttribute('disabled') || target.getAttribute('aria-busy') === 'true') return;\n    target.dataset.pressed = 'true';\n  }, { passive: true, capture: true });\n  const releasePressed = (event) => {\n    const target = event.target instanceof Element ? event.target.closest('button,.btn,[data-action]') : null;\n    if (!target) return;\n    requestAnimationFrame(() => { delete target.dataset.pressed; });\n  };\n  root.addEventListener('pointerup', releasePressed, { passive: true, capture: true });\n  root.addEventListener('pointercancel', releasePressed, { passive: true, capture: true });\n"
          if text.count(old_pointer) != 1:
              raise SystemExit('pointer marker missing')
          text = text.replace(old_pointer, new_pointer)
          runtime.write_text(text)

          css = Path('assets/css/control-center-hardening.css')
          css.write_text(css.read_text() + "\n[data-pressed=true]{transform:scale(.975)!important;filter:brightness(1.12);transition:none!important}\n.control-operation-bar{touch-action:none}\n")

          html = Path('control-center/index.html')
          text = re.sub(r'20260730\.\d+', '20260730.6', html.read_text())
          html.write_text(text)

          perf = Path('tools/audit-control-performance-media.mjs')
          text = perf.read_text().replace("page.includes('?v=20260730.3')", "page.includes('?v=20260730.6')")
          marker = "assert.ok(hardeningCss.includes('button[aria-busy=true]') && hardeningCss.includes('control-operation-track'), 'Busy buttons do not show immediate spinner and progress feedback.');\n"
          addition = marker + "assert.ok(runtime.includes('activeOperationKeys') && runtime.includes('requestAnimationFrame(() => requestAnimationFrame(resolve))'), 'Async actions can rerun before visible feedback paints.');\nassert.ok(runtime.includes(\"root.addEventListener('pointerup'\") && runtime.includes(\"root.addEventListener('pointercancel'\"), 'Samsung Browser press feedback is not released through pointer lifecycle events.');\n"
          if marker not in text:
              raise SystemExit('performance feedback marker missing')
          perf.write_text(text.replace(marker, addition))

          audit = Path('tools/audit-bulk-publish.mjs')
          text = audit.read_text()
          marker = "console.log('✓ Recent bulk actions can be undone safely.');\n"
          if marker in text:
              text = text.replace(marker, marker + "console.log('✓ Rejected imported guides can be restored and re-imported.');\n")
          audit.write_text(text)

          test = Path('tools/test-course-video-import.mjs')
          text = test.read_text()
          marker = "assert.ok(guideImport.includes(\"attachment?.role !== 'hosted-video'\"), 'Hosted course videos must bypass generic R2 attachment copying.');\n"
          addition = marker + "assert.ok(guideImport.includes(\"existing.status !== 'rejected'\"), 'Rejected guides would still be incorrectly treated as unchanged on re-import.');\n"
          if marker not in text:
              raise SystemExit('reimport test marker missing')
          test.write_text(text.replace(marker, addition))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Run full build and regression suite
        run: npm run build
      - name: Commit validated implementation
        run: |
          rm -f package-lock.json
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair undo reimport and Samsung touch feedback"
          git push origin HEAD:agent/whop-guide-importer
